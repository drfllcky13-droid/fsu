  clearTimeout(pushT); pushT=setTimeout(()=>ghPush(false),2500);
  renderSyncPill(); renderSyncBar(); }
function renderSyncBar(){
  const b=$("#syncbar"); if(!b)return;
  const offline=typeof navigator!=="undefined"&&navigator.onLine===false;
  if(!ghOn()||(!dirty&&!syncErr&&!conflict&&!tokenBad&&!badFile)){
    b.style.display="none";b.innerHTML="";fitHeader();return}
  let msg,cls,btn="Retry";
  if(tokenBad){cls="bad";btn="Reconnect";
    msg="The access token has expired or been revoked. Your changes are safe on this device."}
  else if(badFile){cls="bad";btn="Open Sync";
    msg="The file in the repo can't be read. Nothing has been overwritten."}
  else if(conflict){cls="bad";btn="Open Sync";
    msg="Another device kept writing while this one tried to. Open Sync and try again."}
  else if(offline){cls="warn";btn="";
    msg="No connection. Your changes are saved on this device and will sync when you're back online."}
  else if(syncErr){cls="bad";msg=syncErr+". Retrying — your changes are still saved on this device."}
  else {b.style.display="none";b.innerHTML="";fitHeader();return}
  b.className="demobar "+cls; b.style.display="";
  b.innerHTML=`<span>${esc(msg)}</span>${btn?`<button id="syncnow">${btn}</button>`:""}`;
  fitHeader();
}
function renderSyncPill(){
  const el=$("#syncpill"); if(!el)return;
  el.textContent=tokenBad?"Token expired":badFile?"Can't read":conflict?"Busy":
    dirty?"Saving…":S.gh.last?"Synced "+S.gh.last.slice(11,16):"Not synced";
  el.className="syncpill"+(tokenBad||badFile||conflict?" bad":dirty?" busy":"");
}

function autoPlace(side){
  const W=S.walls[side]||{cols:24,rows:12};
  const mine=S.comps.filter(c=>c.side===side);
  const grid=[];for(let r=0;r<W.rows;r++)grid.push(new Array(W.cols).fill(false));
  const mark=(c)=>{for(let r=c.y;r<Math.min(W.rows,c.y+c.h);r++)
    for(let x=c.x;x<Math.min(W.cols,c.x+c.w);x++)grid[r][x]=true};
  const fits=(x,y,w,hh)=>{if(x+w>W.cols||y+hh>W.rows)return false;
    for(let r=y;r<y+hh;r++)for(let q=x;q<x+w;q++)if(grid[r][q])return false;return true};
  mine.filter(c=>c.x!=null&&c.y!=null).forEach(mark);
  mine.filter(c=>c.x==null||c.y==null).forEach(c=>{
    outer:for(let y=0;y<W.rows;y++)for(let x=0;x<W.cols;x++)
      if(fits(x,y,c.w,c.h)){c.x=x;c.y=y;mark(c);break outer}
    if(c.x==null){c.x=0;c.y=0}});
}

function bayZoomApply(k,cx,cy){
  const z=document.getElementById("bayzoom"), p=document.getElementById("bayplan"); if(!z||!p)return;
  const k0=bayZoomK; k=Math.min(4,Math.max(1,k)); if(k===k0)return;
  const r=z.getBoundingClientRect();
  const fx=cx==null?.5:(cx-r.left)/r.width, fy=cy==null?.5:(cy-r.top)/r.height;
  const sx=z.scrollLeft+fx*r.width, sy=z.scrollTop+fy*r.height;
  bayZoomK=k; p.style.setProperty("--k",k);
  z.scrollLeft=sx*k/k0-fx*r.width; z.scrollTop=sy*k/k0-fy*r.height;
  const l=document.getElementById("bayzl"); if(l)l.textContent=Math.round(k*100)+"%";
}
const BAYP=new Map(); let bayPinch=null, bayPan=null;
document.addEventListener("pointerdown",e=>{
  const z=e.target.closest&&e.target.closest("#bayzoom"); if(!z)return;
  if(e.isPrimary){BAYP.clear();bayPinch=null;bayPan=null;bayDragged=false}
  BAYP.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(BAYP.size===2){ const [a,b]=[...BAYP.values()]; bayPinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:bayZoomK}; bayPan=null; e.preventDefault(); return }
  if(e.pointerType==="mouse"){ bayPan={x:e.clientX,y:e.clientY,sl:z.scrollLeft,st:z.scrollTop} }
},true);
document.addEventListener("pointermove",e=>{
  if(!BAYP.has(e.pointerId))return;
  BAYP.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const z=document.getElementById("bayzoom"); if(!z)return;
  if(bayPinch&&BAYP.size>=2){ const [a,b]=[...BAYP.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    bayZoomApply(bayPinch.k*d/Math.max(1,bayPinch.d),(a.x+b.x)/2,(a.y+b.y)/2); e.preventDefault(); return }
  if(bayPan){ const dx=e.clientX-bayPan.x, dy=e.clientY-bayPan.y;
    if(Math.hypot(dx,dy)>6)bayDragged=true;
    z.scrollLeft=bayPan.sl-dx; z.scrollTop=bayPan.st-dy }
},{capture:true,passive:false});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,e=>{
  if(!BAYP.has(e.pointerId))return; BAYP.delete(e.pointerId);
  if(BAYP.size<2)bayPinch=null; if(!BAYP.size)bayPan=null;
},true));
document.addEventListener("wheel",e=>{
  const z=e.target.closest&&e.target.closest("#bayzoom"); if(!z||!(e.ctrlKey||e.metaKey))return;

/* ---------- item detail ---------- */
let curItem=null, curForm=null, prevView="home";
function itemStatus(i){
  if(!placed(i))return["unchecked","Not placed yet"];
  if(isOut(i))return["action","Out of stock"];
  if(isExpired(i))return["action","Expired"];
  if(isLow(i))return["attn","Below par"];
  if(isService(i))return["attn","Service due"];
  if(isExpiring(i))return["attn","Expires in "+daysOut(i.date)+" days"];
  return["good","Good"];
}
function miniWall(code){
  const c=S.comps.find(x=>x.code===code);
  if(!c||!SIDES.includes(c.side))return "";
  SIDES.forEach(autoPlace);
  if(c.x==null||c.y==null)return "";
  const W=S.walls[c.side]||{cols:24,rows:12};
  const mine=comps().filter(o=>o.side===c.side&&o.x!=null);
  return `<div class="mini">
    <div class="minihead"><b>${esc(c.code)}</b> &middot; ${esc(c.side)}</div>
    <div class="minigrid" style="grid-template-columns:repeat(${W.cols},minmax(0,1fr));grid-template-rows:repeat(${W.rows},minmax(0,1fr));gap:${W.cols>60?1:2}px">
      ${mine.map(o=>`<div class="mslot${o.code===c.code?" hit":""}"
        style="grid-column:${o.x+1}/span ${o.w};grid-row:${o.y+1}/span ${o.h}"
        ></div>`).join("")}
    </div>
    <div class="miniorient"><span>${capLeft(c.side)}</span><span>${capRight(c.side)}</span></div>
  </div>`;
}

function relSheet(it){
  const draw=(q)=>{
    const ql=(q||"").toLowerCase();
    const list=live().filter(o=>o.id!==it.id)
      .filter(o=>!ql||(o.name+" "+o.loc+" "+catName(o.cat)).toLowerCase().includes(ql))
      .sort((a,b)=>{const s=(it.rel||[]).includes(b.id)-(it.rel||[]).includes(a.id);
        return s||a.name.localeCompare(b.name)}).slice(0,60);
    $("#rellist").innerHTML=list.map(o=>{const on=(it.rel||[]).includes(o.id);
      return `<button class="relrow${on?" on":""}" data-pick="${o.id}">
        <span class="tick">${on?"&#10003;":""}</span>
        <span><span class="rn">${esc(o.name)}</span><span class="rl">${esc(o.loc||"—")} · ${esc(catName(o.cat))}</span></span>
      </button>`}).join("")||`<p class="hint">Nothing matches that.</p>`;
  };
  openSheet(`<h3>Works with</h3>
    <p style="margin:0 0 12px;color:var(--ink2);font-size:14.5px">Pick the gear used alongside ${esc(it.name)}. Links go both ways.</p>
    <input type="text" id="relq" placeholder="Search items" autocomplete="off">
    <div id="rellist" class="rellist" style="margin-top:10px"></div>
    <button class="btn" id="reldone" style="max-width:none;margin-top:12px">Done</button>`);
  draw("");
  $("#relq").oninput=e=>draw(e.target.value);
  $("#reldone").onclick=()=>{closeSheet();renderItemDetail()};
  $("#rellist").onclick=e=>{
    const b=e.target.closest("[data-pick]"); if(!b)return;
    const o=S.items.find(x=>x.id===b.dataset.pick); if(!o)return;
    it.rel=it.rel||[]; o.rel=o.rel||[];
    if(it.rel.includes(o.id)){it.rel=it.rel.filter(x=>x!==o.id);o.rel=o.rel.filter(x=>x!==it.id)}
    else{it.rel.push(o.id);o.rel.push(it.id)}
    save();draw($("#relq").value);
  };
}

    if(!mine.length)return "";
    const minX=Math.min(...mine.map(c=>c.x)), minY=Math.min(...mine.map(c=>c.y));
    const W=Math.max(...mine.map(c=>c.x+c.w))-minX, H=Math.max(...mine.map(c=>c.y+c.h))-minY;
    const side=mine[0].side;
    return `<section class="punit">

        <span>${esc(side)} · ${W}&Prime; wide · ${mine.length} compartments</span></h3>
      <div class="pgrid" style="grid-template-columns:repeat(${W},minmax(0,1fr));
        grid-template-rows:repeat(${H},minmax(0,1fr));aspect-ratio:${(W/H).toFixed(3)};
        gap:${W>40?1:4}px">

          style="grid-column:${c.x-minX+1}/span ${c.w};grid-row:${c.y-minY+1}/span ${c.h}">

      <div class="porient"><span>${capLeft(side)}</span><span>${capRight(side)}</span></div>

  const rows=cs.filter(c=>SIDES.includes(c.side)).map(c=>{

          i.cat?` <em>${esc(catName(i.cat))}</em>`:""}</span>`).join("")
      : `<span class="pit pempty">empty</span>`;
    return `<tr><td class="pc">${esc(c.code)}</td>
      <td>${esc(c.desc||"")}<div class="pits">${list}</div></td>
      <td class="pn">${it.length}</td></tr>`}).join("");

  $("#v-print").innerHTML=`
    <div class="noprint" style="display:flex;gap:8px;margin-bottom:14px;align-items:center">
      <button class="back" data-navback="compartments" style="margin:0;align-self:center">&#8249; Storage</button>
      <button class="btn" id="doprint" style="margin:0;max-width:none">Print</button></div>
    <p class="hint noprint" style="margin:0 0 16px">A page per unit plus a full index, to tape inside
      the van. Use Safari on a computer to print — the home screen
      version has no print menu.</p>
    <div class="psheet">
      <div class="phead"><b>Van compartment map</b><span>${esc(today())}</span></div>
      ${bays.map(unit).join("")}
      <h3 class="plist">Compartment index</h3>
      <table class="ptab"><thead><tr><th>Code</th><th>What it holds</th><th>Items</th></tr></thead>
        <tbody>${rows}</tbody></table>
    </div>`;
}

// forms and sketches that have not been exported yet are "open"

function openDocs(){
  const f=(S.fills||[]).filter(x=>!x.exported&&!x.incidentId).map(x=>({
    kind:"fill", id:x.id, when:x.started||"",
    caseNo:(fillCase(x)||"").trim(), type:x.formName||"Form"}));
  const s=(S.sketches||[]).filter(x=>!x.exported&&!x.incidentId&&(x.objs||[]).length).map(x=>({
    kind:"sketch", id:x.id, when:x.when||"",
    caseNo:(x.caseNo||"").trim(), type:"Sketch"}));
  return [...f,...s].sort((a,b)=>
    (a.caseNo||"~").localeCompare(b.caseNo||"~")||a.type.localeCompare(b.type));
}
function fillCase(r){
  const f=S.forms.find(x=>x.id===r.formId); if(!f)return "";
  const c=(f.fields||[]).find(x=>/case/i.test(x.label));
  return c?String(r.values[c.id]||"") : "";

function centreDocTab(){
  const on=document.querySelector(".view.on .doctab.on");

  strip.scrollLeft = Math.max(0, on.offsetLeft - (strip.clientWidth - on.offsetWidth)/2);

const STALE_MONTHS=12;
function verifyAge(i){ if(!i.verified)return null;
  const t=dayStart(i.verified); if(isNaN(t))return null;
  return (startOfToday()-t)/86400000/30.44 }
const isStale=i=>{const m=verifyAge(i);return m!==null&&m>STALE_MONTHS};

function parseGuides(text){
  const byName={}; live().forEach(i=>{byName[i.name.trim().toLowerCase()]=i});
  const blocks=[]; let cur=null, afterBlank=true;
  const isStep=l=>/^\s*(?:[-*\u2022]|\d+[.)])\s+/.test(l);
  const strip=l=>l.replace(/^\s*(?:[-*\u2022]|\d+[.)])\s+/,"").trim();
  text.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();
    if(!l){afterBlank=true;return}
    const attr=/^(source|verified)\s*:/i.exec(l);
    if(attr&&cur){cur[attr[1].toLowerCase()]=l.slice(l.indexOf(":")+1).trim();afterBlank=false;return}
    if(afterBlank&&!isStep(l)){
      const hit=byName[l.toLowerCase().replace(/:$/,"")];
      cur={item:hit||null,name:l,steps:[],source:"",verified:""};
      blocks.push(cur);afterBlank=false;return;
    }
    if(cur)cur.steps.push(isStep(l)?strip(l):l);
    afterBlank=false;
  });
  return blocks;
}
function applyGuides(text){
  const blocks=parseGuides(text);
  const good=blocks.filter(b=>b.item&&b.steps.length);
  const miss=blocks.filter(b=>!b.item&&b.steps.length).map(b=>b.name);
  good.forEach(b=>{b.item.steps=b.steps;
    if(b.source)b.item.source=b.source;
    if(b.verified&&/^\d{4}-\d{2}-\d{2}$/.test(b.verified))b.item.verified=b.verified});
  if(good.length)save();
  return {n:good.length,miss:[...new Set(miss)]};
}

/* ---------- data and backup ---------- */
const COLS=["name","loc","cat","cls","qty","par","date","status","gapType","note","source","verified"];
const HEAD=["Item","Compartment","Category","Class","Qty","Par","Date","Status","Gap type","Note","Source","Verified"];
const cell=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=()=>[HEAD.concat("Instructions").join(",")].concat(
  S.items.map(i=>COLS.map(c=>cell(i[c])).concat(cell((i.steps||[]).join(" | "))).join(","))).join("\n");
function parseCSV(t){const rows=[];let row=[],f="",q=false;
  for(let x=0;x<t.length;x++){const c=t[x];
    if(q){if(c==='"'){if(t[x+1]==='"'){f+='"';x++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[x+1]==="\n")x++;row.push(f);f="";
      if(row.some(v=>v!==""))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(v=>v!==""))rows.push(row);return rows}
function download(text,name,type){
  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
    S.lastBackup=today();save();return true}catch(e){return false}}
function ingest(text,replace){
  text=(text||"").trim(); if(!text)return toast("Nothing pasted");
  if(text[0]==="{"){let o;try{o=JSON.parse(text)}catch(e){return toast("That backup didn't parse")}
    if(!o.items)return toast("No items in that file");
    if(replace){S.items=o.items;S.comps=o.comps||[];S.forms=o.forms||[];if(o.walls)S.walls=o.walls;S.demo=!!o.demo}
    else o.items.forEach(x=>{x.id=newId();S.items.push(x)});
    nameComps();
    save();renderData();return toast(o.items.length+" items "+(replace?"restored":"added"))}
  const rows=parseCSV(text); if(rows.length<2)return toast("Nothing to import");
  const add=[];
  rows.slice(1).forEach(r=>{if(!r[0]||!r[0].trim())return;
    const o={id:newId(),uses:[],fav:false};
    COLS.forEach((c,j)=>o[c]=(r[j]??"").trim());
    o.qty=n(o.qty); o.steps=(r[COLS.length]||"").split(" | ").map(s=>s.trim()).filter(Boolean);
    if(!STATUSES.includes(o.status))o.status="Stocked";
    if(!CATS.some(c=>c[0]===o.cat))o.cat="A";
    if(!CLASSES.includes(o.cls))o.cls="Consumable";
    add.push(o)});
  if(replace)S.items=add; else S.items=S.items.concat(add);
  add.forEach(o=>{if(o.loc&&!S.comps.some(c=>c.code===o.loc))
    S.comps.push({code:o.loc,desc:"",side:"",x:null,y:null,w:6,h:4})});
  save();renderData();toast(add.length+" rows "+(replace?"loaded":"added"));
}
// the share sheet puts the file straight into Drive or Mail; download is the fallback
async function backupOut(){
  const safe=Object.assign({},S);delete safe.gh;delete safe.fills;delete safe.sketches;
  delete safe.base;delete safe.tomb;delete safe.dev;   // sync bookkeeping, meaningless elsewhere
  safe.items=(safe.items||[]).map(i=>{const c=Object.assign({},i);delete c.dupOf;return c});
  const text=JSON.stringify(safe,null,1);
  const name="van-backup-"+today()+".json";
  const mark=()=>{S.lastBackup=today();save();renderData()};
  try{
    const file=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Van backup "+today()});
      mark();return toast("Sent \u2014 save it in Van app backups");
    }
  }catch(err){ if(err&&err.name==="AbortError")return; }
  if(download(text,name,"application/json")){mark();return toast("Backup downloaded")}
  toast("Blocked \u2014 use Copy CSV instead");
}

let listKey=null;
// what to order, and how many, for anything short or expiring
function reorderRows(){
  return live().filter(i=>isOut(i)||isLow(i)||isExpired(i))
    .map(i=>{
      const par=n(i.par), have=n(i.qty);
      const need=i.par!==""&&i.par!=null&&par>have ? par-have : (isOut(i)?1:0);
      return {i, need, why: isOut(i)?"Out of stock" : isExpired(i)?"Expired" : "Below par"};
    })
    .sort((a,b)=>(a.i.cat||"").localeCompare(b.i.cat||"")||a.i.name.localeCompare(b.i.name));
}
function reorderText(){
  const rows=reorderRows().filter(r=>!r.i.ordered);
  const when=new Date().toISOString().slice(0,16).replace("T"," ");
  let out="Reorder list \u2014 Forensic Services Unit\nPrepared "+when+"\n\n";
  let cat="";
  rows.forEach(r=>{
    const c=catName(r.i.cat);
    if(c!==cat){out+=(cat?"\n":"")+c+"\n"; cat=c}
    out+="  "+(r.need?r.need+" x ":"")+r.i.name
      +(r.i.loc?"  ("+r.i.loc+")":"")
      +"  \u2014 "+r.why+", "+r.i.qty+" in stock"
      +(r.i.par!==""&&r.i.par!=null?", par "+r.i.par:"")
      +(r.i.vendor||r.i.part||r.i.pack?"\n      "+[r.i.vendor,r.i.part,r.i.pack].filter(Boolean).join(", "):"")+"\n";
  });
  if(!rows.length)out+="Nothing to order.\n";
  return out;
}

  const all=reorderRows(), rows=all.filter(r=>!r.i.ordered), onOrder=all.filter(r=>r.i.ordered);
  const byCat={}; rows.forEach(r=>{const c=catName(r.i.cat);(byCat[c]=byCat[c]||[]).push(r)});
  const card=r=>`<div class="icard"><button class="row" data-item="${r.i.id}">
      <span><span class="code">${r.need?r.need+" &times; ":""}${esc(r.i.name)}</span>
      <span class="desc">${esc(r.i.loc||"not placed")} &middot; ${esc(r.i.qty)} in stock${
        r.i.par!==""&&r.i.par!=null?" &middot; par "+esc(r.i.par):""}${r.i.ordered?" &middot; ordered "+esc(r.i.ordered):""}${r.i.vendor||r.i.part?"<br>"+esc([r.i.vendor,r.i.part,r.i.pack].filter(Boolean).join(" &middot; ")):""}</span></span>
      <span class="rt"><span class="badge b-${r.why==="Below par"?"attn":"action"}">${esc(r.why)}</span><span class="chev">&#8250;</span></span></button>
    <div class="iq">${r.i.ordered
      ?`<button data-received="${r.i.id}">Received</button><button data-unordered="${r.i.id}">Not ordered after all</button>`
      :`<button data-ordered="${r.i.id}">Ordered</button>`}</div></div>`;
  const total=all.length, done=onOrder.length, pct=total?Math.round(100*done/total):0;
  const progress=total?`<div class="ropct">
      <div class="ropctlab"><span>${done} of ${total} ordered</span><span>${rows.length?"Copy list &middot; Send":"All in hand"}</span></div>
      <div class="ropctbar"><i style="width:${pct}%"></i></div>
    </div>`:"";
  $("#v-reorder").innerHTML=`<button class="back" data-navback="home">&#8249; Home</button>`
    +progress
    +(rows.length?`
      <p class="hint" style="margin:0 0 14px">Quantities are what it takes to reach par. Mark each one Ordered once it has gone in, and Received when it arrives.</p>
      <div class="editbar">
        <button id="rocopy" class="on">Copy list</button>
        <button id="roshare">Send</button></div>`
      +Object.keys(byCat).sort().map(c=>`<div class="sect">${esc(c)}</div>`+byCat[c].map(card).join("")).join("")
    :`<div class="empty"><strong>Nothing to order</strong>
        <p>${onOrder.length?"Everything that is short is already on order.":"Everything is at or above par, and nothing has expired."}</p></div>`)
    +(onOrder.length?`<div class="sect">On order — ${onOrder.length}</div>`+onOrder.map(card).join(""):"");
}
function renderList(key){
  const L=live();
  const map={low:["Low or out",L.filter(i=>isOut(i)||isLow(i))],
    expiring:["Expiring",L.filter(i=>isExpiring(i)||isExpired(i)||isService(i))],
    gaps:["Gaps to decide",gaps()],all:["All items",L]};
  const [t,arr]=map[key]||map.all;
  $("#title").textContent=t;
  listKey=key;
  $("#v-home").innerHTML=`<button class="back" data-navback="home">&#8249; Home</button>`
    +(key==="gaps"?`<button class="btn sec" id="addgap" style="margin:0 0 14px;max-width:none">Log something we don't carry</button>`:"")
    +(key==="low"&&reorderRows().length?`<button class="btn" id="goreorder" style="margin:0 0 14px;max-width:none">Make a reorder list</button>`:"")
    +(arr.length?`<div class="rows">`+arr.map(i=>{
      const s=isOut(i)?["action","Out"]:isExpired(i)?["action","Expired"]:isLow(i)?["attn","Below par"]
        :isService(i)?["attn","Service due"]:isExpiring(i)?["attn",daysOut(i.date)+" days"]:["good","OK"];
      return `<button class="row" data-item="${i.id}">
        <span><span class="code">${esc(i.name)}</span>
        <span class="desc">${esc(i.loc||"—")} · ${esc(i.qty)} in stock${i.par?" · par "+esc(i.par):""}${
      i.cls?" · "+esc(i.cls):""}<br>${esc(catName(i.cat))}</span></span>
        <span class="rt"><span class="badge b-${s[0]}">${esc(s[1])}</span><span class="chev">&#8250;</span></span></button>`
      }).join("")+`</div>`
    :`<div class="empty"><strong>Nothing here</strong><p>That list is clear.</p></div>`);
}

/* ---------- search ---------- */
let searchScope="all";
function renderSearch(){
  $("#title").textContent="Search";
  const q=query.toLowerCase();
  const notCarried=S.items.filter(i=>i.status==="Not carried"&&i.gapType!=="request");
  const pool=live().concat(requests(),notCarried);
  const hay=i=>(i.name+" "+i.loc+" "+i.cat+" "+catName(i.cat)+" "+i.cls+" "+(i.contact||"")
    +" "+(i.note||"")+" "+(i.steps||[]).join(" ")
    +" "+((S.comps.find(c=>c.code===i.loc)||{}).desc||"")).toLowerCase();
  const all=pool.filter(i=>hay(i).includes(q));
  const placedAll=all.filter(i=>(i.loc||"").trim());
  const fhitsAll=S.forms.filter(f=>((f.name||"")+" "+(f.desc||"")+" "+(f.cat||"")+" "+(f.rev||"")).toLowerCase().includes(q));
  if(searchScope==="compartment"&&!placedAll.length&&(all.length||fhitsAll.length))searchScope="all";
  if(searchScope==="forms"&&!fhitsAll.length&&all.length)searchScope="all";
  const scoped=searchScope==="compartment"?placedAll:all;
  const hits=scoped.slice(0,40);
  const fhits=(searchScope==="forms"||searchScope==="all")?fhitsAll.slice(0,8):[];
  const filt=(k,l,n)=>`<button data-searchscope="${k}" class="${searchScope===k?"sel":""}">${l}<span class="n">${n}</span></button>`;
  const rail=`<div class="filters searchrail">
    ${filt("all","All results",all.length+fhitsAll.length)}
    ${filt("compartment","By compartment",placedAll.length)}
    ${filt("forms","Forms",fhitsAll.length)}
  </div>`;
  let body=(searchScope!=="forms"&&hits.length)
    ? `<div class="sect">${scoped.length>hits.length?"Showing "+hits.length+" of "+scoped.length:hits.length+" result"+(hits.length===1?"":"s")}</div><div class="rows">`
      +hits.map(i=>{const cp=S.comps.find(c=>c.code===i.loc);
        return `<button class="row" data-item="${i.id}">
          <span><span class="code">${esc(i.name)}</span>
          <span class="desc">${isRequest(i)?esc(i.contact||"Not in the van")
            :i.status==="Not carried"?"Not in the van"+(i.note?" · "+esc(i.note):"")
            :esc(i.loc||"—")+(cp&&cp.desc?" · "+esc(cp.desc):"")+" · "+esc(i.qty)+" in stock"}</span></span>
          <span class="rt">${isRequest(i)?`<span class="badge b-req">On request</span>`
            :i.status==="Not carried"?`<span class="badge b-${i.gapType==="deliberate"?"unchecked":"action"}">${i.gapType==="deliberate"?"Not carried":"Gap"}</span>`
            :""}<span class="chev">&#8250;</span></span></button>`}).join("")+`</div>`
    : (searchScope==="forms"?"":`<div class="empty"><strong>Nothing found</strong><p>No item, compartment, or category matches that.</p></div>`);
  if(fhits.length)body+=`<div class="sect">Forms — ${fhits.length}</div><div class="rows">`+fhits.map(f=>
      `<button class="row" data-form="${f.id}">
        <span><span class="code">${esc(f.name)}</span>
        <span class="desc">${esc(f.rev?"Rev "+f.rev+" · ":"")}${esc(f.cat||"")}</span></span>
        <span class="rt"><span class="badge b-req">Form</span><span class="chev">&#8250;</span></span></button>`).join("")+`</div>`;
  if(searchScope==="forms"&&!fhits.length)body=`<div class="empty"><strong>No forms found</strong><p>No form name, revision, or category matches that.</p></div>`;
  if(all.length>hits.length&&searchScope!=="forms")body+=`<p class="hint">Add another word to narrow it down.</p>`;
  $("#v-search").innerHTML=`<div class="searchsplit">${rail}<div>${body}</div></div>`;
  $$("#v-search [data-searchscope]").forEach(b=>b.onclick=()=>{searchScope=b.dataset.searchscope;renderSearch()});
}

        +here.slice().reverse().map(i=>`<button class="row" data-item="${i.id}">

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(appExtraClick10(e)||appExtraClick9(e)||appExtraClick7(e)||appExtraClick(e))return;
  const nb=e.target.closest("[data-navback]");
  if(nb){e.stopPropagation();return navBack(nb.dataset.navback)}
  const g=e.target.closest("[data-go]"); if(g)return go(g.dataset.go);
  if(e.target.closest("#gotidy")){view="tidy";window.scrollTo&&window.scrollTo(0,0);return render()}
  if(e.target.closest("#goreorder")){view="reorder";window.scrollTo&&window.scrollTo(0,0);return render()}
  if(e.target.closest("#rocopy")){
    const t=reorderText();
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>toast("Could not copy"));
    else toast("Could not copy");
    return}
  if(e.target.closest("#roshare")){
    const t=reorderText(), name="reorder-"+today()+".txt";
    (async()=>{
      try{
        const file=new File([t],name,{type:"text/plain"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:"Reorder list"}); logAct("reorder","Sent the reorder list"); return toast("Sent")}
      }catch(err){ if(err&&err.name==="AbortError")return }
      if(download(t,name,"text/plain"))toast("Downloaded"); else toast("Use Copy list instead");
    })();
    return}
  const l=e.target.closest("[data-list]"); if(l){view="home";return renderList(l.dataset.list)}
  const bh=e.target.closest("[data-bay]");
  if(bh){rememberScroll();prevView="compartments";curBay=bh.dataset.bay;
    view="bay";window.scrollTo&&window.scrollTo(0,0);return render()}
  const c=e.target.closest("[data-comp]");
  if(c){
    rememberScroll();prevView=view==="bay"?"bay":"compartments";curComp=c.dataset.comp;view="compdetail";
    $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-compdetail"));
    window.scrollTo&&window.scrollTo(0,0);return render()}
  const ec=e.target.closest("[data-editcomp]");
  if(ec){const c=S.comps.find(x=>x.code===ec.dataset.editcomp); if(!c)return;
    const held=live().filter(i=>i.loc===c.code).length;
    openSheet(`<h3>Edit compartment</h3>
      <div class="two"><label class="fld"><span>Code</span>
        <input type="text" id="cc" value="${esc(c.code)}" autocapitalize="characters"></label>
      <label class="fld"><span>Side of the van</span><select id="cs">
        <option value="">Not placed</option>${SIDES.map(z=>`<option${z===c.side?" selected":""}>${z}</option>`).join("")}</select></label></div>
      <label class="fld"><span>Where it is, in plain words</span>
        <input type="text" id="cd" value="${esc(c.desc||"")}" placeholder="Drawer 3, left"></label>
      <p class="hint" style="margin:0 0 14px">${held?"Renaming moves all "+held+" item"+(held===1?"":"s")+" in here with it.":"Nothing logged in here yet."}</p>
      <button class="btn" id="csave" style="max-width:none;margin:0">Save</button>
      <button class="btn sec" id="cdel" style="max-width:none;color:var(--red);border-color:var(--red)">Delete compartment</button>
      <button class="btn sec" id="cx" style="max-width:none">Cancel</button>`);
    $("#cx").onclick=closeSheet;
    $("#cdel").onclick=()=>askConfirm("Delete compartment",
      held?"The "+held+" item"+(held===1?"":"s")+" in "+c.code+" stay in the van but lose their compartment. You can reassign them from each item.":"Nothing is in "+c.code+", so nothing else changes.",
      "Delete compartment",true,()=>{
        S.items.forEach(i=>{if(i.loc===c.code)i.loc=""});
        S.comps=S.comps.filter(x=>x.code!==c.code);
        if(S.curLoc===c.code)S.curLoc="";
        save();go("compartments");toast(c.code+" deleted")});
    $("#csave").onclick=()=>{
      const nu=$("#cc").value.trim().toUpperCase();
      if(!nu)return toast("Needs a code");
      if(nu!==c.code&&S.comps.some(x=>x.code===nu))return toast(nu+" already exists");
      const old=c.code;
      if(nu!==old){S.items.forEach(i=>{if(i.loc===old)i.loc=nu});
        if(S.curLoc===old)S.curLoc=nu; c.code=nu; curComp=nu}
      c.side=$("#cs").value; c.desc=$("#cd").value.trim();
      save();closeSheet();renderCompDetail();toast("Saved")};
    return}
  const ah=e.target.closest("[data-addhere]");
  if(ah){S.curLoc=ah.dataset.addhere;S.lastCat="";save();return go("sweep")}
  const ck=e.target.closest("[data-check]");
  if(ck){const cc=S.comps.find(x=>x.code===ck.dataset.check);
    if(cc){cc.checked=new Date().toISOString().slice(0,10);logAct("sweep","Swept "+cc.code);save();renderCompDetail();
      toast(cc.code+" marked swept");
      // finishing a sweep is the moment a backup is worth most
      const left=S.comps.filter(c=>!c.checked).length;
      if(left===0&&S.comps.length){
        const stale=!S.lastBackup||S.lastBackup!==today();
        if(stale)setTimeout(()=>askConfirm("Sweep finished",
          "All "+S.comps.length+" compartments are checked. Back up now so there is a copy off this phone.",
          "Back up",false,()=>backupOut()),700);
      }}
    return}
  if(e.target.closest("#doprint")){window.print&&window.print();return}
  if(e.target.closest("#syncnow")){
    if(conflict||tokenBad||badFile){openSettings("sync");return}
    syncErr="";retries=0;renderSyncBar();toast("Retrying");ghPush(false);return}
  if(e.target.closest("[data-newinc]")){
    const inc=newIncident(); curInc=inc.id; view="incident"; render(); incidentSheet(inc); return}
  const ib=e.target.closest("[data-inc]");
  if(ib){curInc=ib.dataset.inc; view="incident"; render(); return}
  if(e.target.closest("[data-incbundle]")){
    const inc=incidentOf(curInc); if(!inc)return;
    toast("Building the bundle"+String.fromCharCode(8230)); bundleIncident(inc); return}
  if(e.target.closest("[data-incedit]")){
    const inc=incidentOf(curInc); if(inc)incidentSheet(inc); return}
  if(e.target.closest("[data-incdel]")){
    const inc=incidentOf(curInc); if(!inc)return;
    const docs=docsFor(inc.id);
    return askConfirm("Delete incident",
      (docs.length? docs.length+" document"+(docs.length===1?"":"s")+" started for "
        +(inc.caseNo||"this incident")+" will be deleted with it. "
        : "")+"Anything already exported to the case file is unaffected.",
      "Delete everything",true,()=>{
        (S.sketches||[]).forEach(s=>{ if(s.incidentId===inc.id&&s.bg&&s.bg.imgId)
          photoDel(s.bg.imgId).catch(()=>{});
          if(s.incidentId===inc.id)(s.objs||[]).forEach(o=>{
            if(o.photoId)photoDel(o.photoId).catch(()=>{})}) });
        S.fills=(S.fills||[]).filter(x=>x.incidentId!==inc.id);
        S.sketches=(S.sketches||[]).filter(x=>x.incidentId!==inc.id);
        S.incidents=(S.incidents||[]).filter(x=>x.id!==inc.id);
        curInc=null; save(); view="active"; window.scrollTo&&window.scrollTo(0,0);
        render(); toast("Incident deleted")})}
  if(e.target.closest("[data-incclose]")){
    const incR=incidentOf(curInc);
    if(incR&&incR.closed){ delete incR.closed; save(); renderIncident(); return toast("Reopened") }
    const inc=incidentOf(curInc); if(!inc)return;
    const left=(inc.plan||[]).map(k=>planState(inc,k)).filter(p=>p&&p.state!=="done").length;
    return askConfirm("Close incident",
      left? left+" document"+(left===1?"":"s")+" still outstanding. Closing moves it out of Active; "
            +"you can still reopen it from the incident list."
          : "This moves it out of Active. You can reopen it later.",
      "Close it",false,()=>{
        inc.closed=new Date().toISOString(); save(); view="active"; render(); toast("Incident closed")})}
  // start (or open) a planned document, carrying the incident's details into it
  const pb=e.target.closest("[data-plan]");
  if(pb){
    const inc=incidentOf(curInc); if(!inc)return;
    const st=planState(inc,pb.dataset.plan); if(!st)return;
    if(st.docs.length){
      const d=st.docs[0];
      prevView="incident";
      if(d.kind==="fill"){curFill=d.id;view="fill"} else {curSketch=d.id;selObj=null;view="sketch"}
      return render();
    }
    if(st.d.form){
      const f=S.forms.find(x=>x.name===st.d.form);
      if(!f)return toast("That form is missing \u2014 add it in Scene");
      const r=newFill(f); r.incidentId=inc.id;
      const put=(re,val)=>{const fd=(f.fields||[]).find(x=>re.test(x.label)); if(fd&&val)r.values[fd.id]=val};
      put(/case/i, inc.caseNo); put(/offence|incident type/i, inc.offence); put(/address|scene/i, inc.addr);
      put(/^date( of incident)?$/i,(inc.opened||"").slice(0,10)); put(/^time of incident$/i,(inc.opened||"").slice(11,16));
      put(/reporting officer|prepared by|completed by|maintained by|photographer/i,S.whoName||S.who||"");
      put(/^date of report$/i,today());
      put(/photographs taken/i,String((S.sketches||[]).filter(s=>s.incidentId===inc.id).reduce((a,s)=>a+(s.objs||[]).filter(o=>o.t==="photopoint").length,0)||""));
      save(); prevView="incident"; curFill=r.id; view="fill"; return render();
    }
    return startSketch(inc.id);
  }
  const gob=e.target.closest('[data-go="incident"]');
  if(gob){
    const r=(S.fills||[]).find(x=>x.id===curFill), sk2=S.sketches.find(x=>x.id===curSketch);
    const inc=(view==="fill"&&r&&r.incidentId)||(view==="sketch"&&sk2&&sk2.incidentId);
    if(inc)curInc=inc;
    view="incident"; window.scrollTo&&window.scrollTo(0,0); return render();
  }
  const fdn=e.target.closest("[data-fdone]");
  if(fdn){
    const r=(S.fills||[]).find(x=>x.id===fdn.dataset.fdone); if(!r)return;
    if(r.completed){ delete r.completed; save(); renderFill(); return toast("Reopened") }
    r.completed=new Date().toISOString(); save();
    curInc=r.incidentId; view="incident"; window.scrollTo&&window.scrollTo(0,0);
    render(); return toast("Marked complete");
  }
  const dtb=e.target.closest("[data-doc]");
  if(dtb){const [k,id]=dtb.dataset.doc.split(":");
    if(k==="fill"){curFill=id;view="fill"} else {curSketch=id;selObj=null;view="sketch"}
    window.scrollTo&&window.scrollTo(0,0); return render()}
  if(e.target.closest("#newsketch"))return startSketch(curInc||"");
  const sko=e.target.closest("[data-sk]");

// quick add: name, count and category, so nothing has to be fixed up afterwards
let justAdded=[];
function quickAdd(){
  const f=$("#q-name"); if(!f)return;
  let nm=f.value.trim(); if(!nm)return toast("Item needs a name");
  const qf=$("#q-qty"), cf=$("#q-cat");
  let qty=Math.max(1,parseInt((qf&&qf.value)||"1",10)||1);
  // "x6" on the end still works, and wins over the field
  const m=nm.match(/\s+[x\u00d7*]\s?(\d{1,4})$/i);
  if(m){qty=parseInt(m[1],10)||1; nm=nm.slice(0,m.index).trim()}
  if(!nm)return toast("Item needs a name");
  const cat=(cf&&cf.value)||S.lastCat||CATS[0][0];
  S.lastCat=cat;
  const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:nm,loc:S.curLoc,
    cat,cls:S.lastCls||CLASSES[0],qty,par:"1",date:"",
    status:"Stocked",gapType:"",note:"",steps:[],source:"",verified:"",
    uses:[],rel:[],links:[],fav:false};
  const elsewhereIn=live().find(i=>i.id!==it.id&&i.name.toLowerCase()===nm.toLowerCase());
  it.dupOf=elsewhereIn?(elsewhereIn.loc||"the van"):"";
  S.items.push(it); save();
  justAdded.unshift(it.id); justAdded=justAdded.slice(0,6);
  f.value=""; f.focus();          // the count and category stay put for the next one
  paintJust(); refreshSweepList();
}
function paintJust(){
  const box=$("#qjust"); if(!box)return;
  const rows=justAdded.map(id=>S.items.find(i=>i.id===id)).filter(Boolean).filter(i=>i.loc===S.curLoc);
  box.innerHTML=rows.length?`<p class="hint" style="margin:14px 0 6px">Just added</p>`
    +rows.map(i=>`<div class="justrow${i.dupOf?" dup":""}">
      <span class="jn">${esc(i.name)}${i.dupOf?`<span class="jdup">also in ${esc(i.dupOf)}</span>`:""}</span>
      <span class="jq">${esc(i.qty)}</span>
      <button class="jx" data-item="${i.id}">Details</button>
      <button class="jx" data-undo="${i.id}">Undo</button></div>`).join(""):"";
}
function refreshSweepList(){
  const here=live().filter(i=>i.loc===S.curLoc);
  const host=$("#sweeplist"); if(!host)return;
  host.innerHTML=here.length?`<div class="sect">In ${esc(S.curLoc)} — ${here.length}</div><div class="rows">`
    +here.slice().reverse().map(i=>`<button class="row" data-item="${i.id}">
      <span><span class="code">${esc(i.name)}</span><span class="desc">${esc(i.qty)} in stock${i.par?" · par "+esc(i.par):""}</span></span>
      <span class="rt"><span class="chev">&#8250;</span></span></button>`).join("")+`</div>`:"";
}

function renderView(v){

// where you have been, so Back goes back one step instead of to the start
const NAV=[];
const navSnap=()=>({view,curItem,curComp,curBay,curFill,curSketch,curInc,curLayer,
  prevView,invGroup,sceneSub:null});
const navSame=(a,b)=>a&&b&&a.view===b.view&&a.curItem===b.curItem&&a.curComp===b.curComp
  &&a.curBay===b.curBay&&a.curFill===b.curFill&&a.curSketch===b.curSketch&&a.curInc===b.curInc;
let navLast=null, navGoingBack=false;
function navRecord(){
  const now=navSnap();
  if(navGoingBack){navGoingBack=false;navLast=now;return}
  if(navLast&&!navSame(navLast,now)){
    NAV.push(navLast);
    if(NAV.length>40)NAV.shift();
  }
  navLast=now;
}
function navBack(fallback){
  const prev=NAV.pop();
  if(!prev){ if(fallback)go(fallback); return }
  navGoingBack=true;
  view=prev.view; curItem=prev.curItem; curComp=prev.curComp; curBay=prev.curBay;
  curFill=prev.curFill; curSketch=prev.curSketch; curInc=prev.curInc;
  curLayer=prev.curLayer; prevView=prev.prevView;
  $$(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+view));
  render(); restoreScroll(view);
}
function render(depth){
  depth=depth||0;
  const asked=view;
  navRecord();
  applySideMin();
  buildTabs();renderDemoBar();renderSyncBar();
  const main=document.querySelector(".main");
  const master=DETAILS.includes(view)&&prevView&&prevView!==view
    &&!["itemdetail","fill"].includes(prevView)?prevView:null;
  const split=wideNow()&&!!master;
  $$(".view").forEach(s=>{s.classList.remove("pane-master","pane-detail");
    s.classList.toggle("on",s.id==="v-"+view||(split&&s.id==="v-"+master))});
  if(main)main.classList.toggle("split",split);
  if(split){
    $("#v-"+master).classList.add("pane-master");
    $("#v-"+view).classList.add("pane-detail");
    renderView(master);
  }
  renderView(view);
  keepAddress();
  // a renderer whose record is gone sets view to a fallback and draws that instead. The .on
  // class was already put on the old section, so without this the page shows an empty one.
  if(view!==asked&&depth<4)return render(depth+1);
}

/* a sketch with a case number and no incident */
/* home: a setup checklist while the unit is still being logged */
function setupCard(){
  if(S.setupHide&&Date.now()-Date.parse(S.setupHide)<7*86400000)return "";
  const cs=comps(), L=live(); if(!cs.length&&!L.length)return "";
  const rows=[
    [cs.filter(c=>!(c.desc||"").trim()).length,"compartment|compartments|not named","compartments"],
    [L.filter(i=>!placed(i)).length,"item|items|not placed in a compartment","sweep"],
    [L.filter(i=>placed(i)&&!String(i.par||"").trim()).length,"item|items|without a par level","tidy"],
    [L.filter(i=>(i.steps||[]).length&&!i.verified).length,"instruction set|instruction sets|unverified","verify"],
    [cs.filter(c=>!c.checked).length,"compartment|compartments|not swept","sweep"]].filter(r=>r[0]>0)
    .map(r=>{const [one,many,rest]=r[1].split("|"); return [r[0],(r[0]===1?one:many)+" "+rest,r[2]]});
  if(!rows.length)return "";
  return `<div class="setupcard"><div class="sh"><b>Set up this unit</b><span>${5-rows.length} of 5 done</span>
      <button class="lnkbtn" data-setuphide="1">Hide for a week</button></div>
    ${rows.map(([n,l,g])=>`<button class="act" ${g==="verify"?'data-verifyrun="1"':'data-go="'+g+'"'}><span>${n} ${l}</span><span class="chev">&#8250;</span></button>`).join("")}</div>`;
}

/* the sweep: by bay, with names, and a next button */
function nextUnchecked(after){
  const cs=comps(); if(!cs.length)return null;
  let start=after?cs.findIndex(c=>c.code===after)+1:0;
  for(let k=0;k<cs.length;k++){const c=cs[(start+k)%cs.length]; if(!c.checked)return c}
  return null;
}
function sweepNextBar(cs,cur){
  const left=cs.filter(c=>!c.checked).length; if(!cs.length)return "";
  if(!left)return `<div class="okbox" style="margin-bottom:12px">Every compartment has been checked this sweep.</div>`;
  const nxt=nextUnchecked(cur);
  return `<div class="polybar"><span>${left} of ${cs.length} still to check${nxt?" — next is "+esc(nxt.code)+(nxt.desc?", "+esc(nxt.desc):""):""}</span>
    <button data-sweepnext="1">${cur?"Go to the next":"Start with the first"}</button>
    <button data-scan="sweep">Scan a label</button></div>`;
}
function sweepList(cs,cur){
  const groups={}; cs.forEach(c=>{const b=bayOf(c.code);(groups[b]=groups[b]||[]).push(c)});
  return Object.keys(groups).sort().map(b=>{const g=groups[b], done=g.filter(c=>c.checked).length;
    return `<div class="sect">${esc(BAYNAME[b]||("Bay "+b))} — ${done} of ${g.length} swept</div><div class="rows">`
      +g.map(c=>{const st=compState(c.code), n=st.items.length;
        return `<button class="row${c.code===cur?" on":""}" data-loc="${esc(c.code)}">
          <span><span class="code">${esc(c.code)}</span><span class="desc">${esc(c.desc||"Not named yet")}${n?" · "+n+(n===1?" item":" items"):""}</span></span>
          <span class="rt"><span class="badge b-${c.checked?"good":"unchecked"}">${c.checked?"Swept":"Not checked"}</span><span class="chev">&#8250;</span></span></button>`}).join("")+`</div>`}).join("");
}
const regUncounted=code=>live().filter(i=>i.loc===code&&i.cls==="Regulated"&&i.counted!==today());
function markSweptNext(code){
  const cc=S.comps.find(x=>x.code===code); if(!cc)return;
  cc.checked=today(); logAct("sweep","Swept "+cc.code); save();
  const n=nextUnchecked(code);
  if(n){ S.curLoc=n.code; S.pick=false; S.lastCat=""; save(); renderSweep(); toast("Swept — next is "+n.code+(n.desc?", "+n.desc:""));
    const f=$("#q-name")||$("#f-name"); if(f)f.focus() }
  else { S.curLoc=""; save(); renderSweep(); toast("Swept — that was the last one");
    if(S.lastBackup!==today())setTimeout(()=>askConfirm("Sweep finished","All "+S.comps.length+" compartments are checked. Back up now so there is a copy off this device.","Back up",false,()=>backupOut()),700) }
}

/* guide verification, one set at a time */
function verifyRun(){
  whoIs(who=>{
    const list=live().filter(i=>(i.steps||[]).length&&(!i.verified||isStale(i))).sort((a,b)=>a.name.localeCompare(b.name));
    if(!list.length)return toast("Every set of instructions has a verified date within the year");
    let idx=0, done=0;
    const finish=()=>{closeSheet(); save(); if(view==="guide")renderGuide(); else render(); toast(done+" verified")};
    const draw=()=>{
      if(idx>=list.length)return finish();
      const i=list[idx];
      openSheet(`<h3>Verify ${idx+1} of ${list.length}</h3>
        <div class="idsect" style="margin-top:0">${esc(i.name)}</div>
        <p class="hint" style="margin:0 0 10px">${esc(i.source||"No source recorded")} · ${i.verified?"last verified "+esc(i.verified):"never verified"}</p>
        <div class="steps">${(i.steps||[]).map((s,x)=>`<div class="step"><i>${x+1}</i><p>${esc(s)}</p></div>`).join("")}</div>
        <div class="stackb" style="margin-top:12px">
          <button class="btn" id="vfok" style="max-width:none;margin:0">Confirmed against the current sheet</button>
          <button class="btn sec" id="vffix" style="max-width:none">Needs fixing</button>
          <button class="btn sec" id="vfskip" style="max-width:none">Skip</button>
          <button class="btn sec" id="vfx" style="max-width:none">Stop</button></div>`);
      $("#vfok").onclick=()=>{i.verified=today(); i.verifiedBy=who; delete i.verifyNote; done++; logAct("verify","Verified instructions for "+i.name); idx++; draw()};
      $("#vffix").onclick=()=>{i.verifyNote="Needs fixing, "+today()+(who?" ("+who+")":""); logAct("verify",i.name+" instructions flagged as needing fixing"); idx++; draw()};
      $("#vfskip").onclick=()=>{idx++; draw()};
      $("#vfx").onclick=finish;
    };
    draw();
  });
}

/* counts: every compartment in turn, or the regulated items in one */
function countRows(items){
  return items.map(i=>`<div class="countrow"><span>${esc(i.name)}${i.par?` <span class="hint" style="display:inline">· par ${esc(i.par)}</span>`:""}</span>
    <input type="text" inputmode="numeric" data-cnt="${i.id}" value="${esc(i.qty)}" aria-label="Count of ${esc(i.name)}"></div>`).join("");
}
function applyCounts(who){
  let changed=0;
  $$("[data-cnt]").forEach(el=>{const i=S.items.find(x=>x.id===el.dataset.cnt); if(!i)return;
    const v=parseInt(el.value,10); if(isNaN(v))return;
    if(v!==n(i.qty)){setQty(i,v);changed++}
    i.counted=today(); i.countedBy=who});
  return changed;
}
function countRun(){
  whoIs(who=>{
    const cs=comps().filter(c=>live().some(i=>i.loc===c.code));
    if(!cs.length)return toast("Nothing is placed in a compartment yet");
    let idx=0, changed=0;
    const summary=()=>{
      const short=live().filter(i=>isOut(i)||isLow(i));
      logAct("count","Counted stock in "+cs.length+" compartment"+(cs.length===1?"":"s")+", "+changed+" change"+(changed===1?"":"s"));
      save();
      openSheet(`<h3>Count finished</h3>
        <p class="hint" style="margin:0 0 12px">${cs.length} compartments counted, ${changed} quantit${changed===1?"y":"ies"} changed.</p>
        ${short.length?`<div class="sect" style="margin-top:0">Below par or out — ${short.length}</div><div class="rows">${short.map(i=>`<button class="row" data-item="${i.id}"><span><span class="code">${esc(i.name)}</span><span class="desc">${esc(i.loc||"")} · ${esc(i.qty)} in stock${i.par?" · par "+esc(i.par):""}</span></span><span class="rt"><span class="chev">&#8250;</span></span></button>`).join("")}</div>
          <button class="btn" data-go="reorder" style="max-width:none;margin:12px 0 0">Open the reorder list</button>`
          :`<div class="okbox">Nothing is short.</div>`}
        <button class="btn sec" id="ctx" style="max-width:none">Close</button>`);
      $("#ctx").onclick=()=>{closeSheet(); render()};
    };
    const draw=()=>{
      if(idx>=cs.length)return summary();
      const c=cs[idx], items=live().filter(i=>i.loc===c.code).sort((a,b)=>a.name.localeCompare(b.name));
      openSheet(`<h3>Count ${idx+1} of ${cs.length} — ${esc(c.code)}</h3>
        <p class="hint" style="margin:0 0 10px">${esc(c.desc||"")}${c.side?" · "+esc(c.side):""}. Type what is actually there.</p>
        ${countRows(items)}
        <div class="stackb" style="margin-top:12px">
          <button class="btn" id="ctnext" style="max-width:none;margin:0">${idx+1<cs.length?"Next compartment":"Finish"}</button>
          ${idx?`<button class="btn sec" id="ctback" style="max-width:none">Back</button>`:""}
          <button class="btn sec" id="ctstop" style="max-width:none">Stop</button></div>`);
      $("#ctnext").onclick=()=>{changed+=applyCounts(who); save(); idx++; draw()};
      const bk=$("#ctback"); if(bk)bk.onclick=()=>{changed+=applyCounts(who); save(); idx--; draw()};
      $("#ctstop").onclick=()=>{changed+=applyCounts(who); logAct("count","Counted stock in "+(idx+1)+" compartment"+(idx?"s":"")+", stopped early"); save(); closeSheet(); render(); toast("Stopped — counts so far are kept")};
      setTimeout(()=>{const f=$("[data-cnt]"); if(f){f.focus();f.select&&f.select()}},80);
    };
    draw();
  });
}

/* the data view folds into sections */
const DATA_OPEN=new Set(["Saved on this device","Back up","Case material"]);
function foldData(){
  const root=$("#v-data"); if(!root)return;
  [...root.querySelectorAll(":scope > .idsect")].forEach(h=>{
    if(h.classList.contains("dhead"))return;
    const key=h.textContent.trim(), wrap=document.createElement("div"); wrap.className="dfold";
    let nx=h.nextSibling; const kids=[];
    while(nx&&!(nx.nodeType===1&&nx.classList.contains("idsect"))){kids.push(nx);nx=nx.nextSibling}
    kids.forEach(k=>wrap.appendChild(k)); h.after(wrap);
    const open=(S.dataOpen&&key in S.dataOpen)?!!S.dataOpen[key]:DATA_OPEN.has(key);
    wrap.hidden=!open; h.classList.add("dhead"); h.setAttribute("role","button"); h.setAttribute("tabindex","0"); h.dataset.dfold=key;
    h.innerHTML=`<span>${esc(key)}</span><span class="dchev">${open?"&#8722;":"+"}</span>`;
  });
}

/* labels and deep links */
const appUrl=()=>String(S.appUrl||"").trim()||(/^https?:/.test(location.protocol)?location.origin+location.pathname:"");
const qrText=(kind,val)=>{const b=appUrl(); return b?b+"#"+kind+"="+encodeURIComponent(val):"fsu:"+kind+":"+val};
let QRP=null;
function qrLib(){
  if(window.qrcode)return Promise.resolve();
  if(QRP)return QRP;
  QRP=new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
    s.onload=res; s.onerror=()=>{QRP=null;rej(new Error("no network"))}; document.head.appendChild(s)});
  return QRP;
}
function labelHTML(kind,x){

    .catch(()=>toast("The QR maker needs a connection the first time. The labels print without codes until then."));

function openTarget(kind,val,mode){
  // this can fire from a hand-typed or bookmarked address on either page (handleHash runs on
  // load and on hashchange, unconditionally), not only from the van's own scan button — so
  // every kind checks it is on the page that can actually show it, rather than blanking the
  // screen the way a stuck `view` with nothing to draw into would
  if(kind==="c"||kind==="i"){
    if(!here(kind==="c"?"compdetail":"itemdetail"))return toast("That is a van code — open it in the FSU app");
  }
  if(kind==="c"){ if(!S.comps.some(c=>c.code===val))return toast("No compartment "+val+" is logged");
    logAct("scan","Opened "+val+" from a label");
    if(mode==="sweep"){S.curLoc=val;S.pick=false;save();renderSweep();const f=$("#q-name")||$("#f-name");if(f)f.focus();return}
    curComp=val; prevView="compartments"; view="compdetail"; window.scrollTo(0,0); render(); return }
  if(kind==="i"){ if(!S.items.some(i=>i.id===val))return toast("That item is no longer logged");
    curItem=val; prevView="inventory"; view="itemdetail"; window.scrollTo(0,0); render(); return }
  // sketches and incidents are never printed as labels here; this exists only in case a foreign
  // code is scanned. It cannot open in this app, and this app never opens the other one.
  if(kind==="s"||kind==="inc")return toast("That is a Scenes code — open it in the Scenes app");
}
function openScanned(text,mode){
  const s=String(text||""); const m=s.match(/#(c|i|s|inc)=([^&]+)/)||s.match(/^fsu:(c|i|s|inc):(.+)$/);
  if(!m)return toast("That isn't an FSU label");
  openTarget(m[1],decodeURIComponent(m[2]),mode);
}
function handleHash(){
  const m=location.hash.match(/^#(c|i|s|inc)=(.+)$/); if(!m)return;
  try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}
  openTarget(m[1],decodeURIComponent(m[2]));
}
/* the scanner: live camera when the browser allows it, a photo from the camera app otherwise.
   BarcodeDetector where it exists (Chrome, Android), jsQR loaded on demand everywhere else (iPad, iPhone). */
let JSQRP=null;
function jsqrLib(){
  if(window.jsQR)return Promise.resolve();
  if(JSQRP)return JSQRP;
  JSQRP=new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    s.onload=res; s.onerror=()=>{JSQRP=null;rej(new Error("no network"))}; document.head.appendChild(s)});
  return JSQRP;
}
const hasDetector=()=>"BarcodeDetector" in window;
function loadStill(file){
  if(typeof createImageBitmap==="function")return createImageBitmap(file);
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im)}; im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("not an image"))}; im.src=u});
}
// text of the first QR code in a video frame or a still, or null
async function decodeFrame(src){
  if(hasDetector()){
    try{ const det=new BarcodeDetector({formats:["qr_code"]}); const codes=await det.detect(src); if(codes.length)return codes[0].rawValue }catch(e){}
  }
  await jsqrLib();
  const sw=src.videoWidth||src.naturalWidth||src.width||0, sh=src.videoHeight||src.naturalHeight||src.height||0;
  if(!sw||!sh)return null;
  const k=Math.min(1,1024/sw), W=Math.round(sw*k), H=Math.round(sh*k);
  const c=decodeFrame.c||(decodeFrame.c=document.createElement("canvas"));
  c.width=W;c.height=H; const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(src,0,0,W,H);
  const d=g.getImageData(0,0,W,H); const r=jsQR(d.data,W,H,{inversionAttempts:"dontInvert"});
  return r&&r.data?r.data:null;
}
async function scanSheet(mode){
  const canLive=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  openSheet(`<h3>Scan a label</h3>
    ${canLive?`<video id="scv" playsinline muted style="width:100%;border-radius:12px;background:#000;aspect-ratio:4/3"></video>`:""}
    <p class="hint" id="scmsg" style="margin:10px 0">${canLive?"Hold the label in view.":"Take a photo of the label and it opens here."}</p>
    <label class="btn${canLive?" sec":""}" style="max-width:none;display:block;text-align:center;margin:0">${canLive?"Use the camera app instead":"Open the camera"}<input type="file" id="scfile" accept="image/*" capture="environment" style="display:none"></label>
    <button class="btn sec" id="scx" style="max-width:none">Cancel</button>`);
  let stream=null; const stop=()=>{ if(stream)stream.getTracks().forEach(t=>t.stop()); stream=null };
  const msg=t=>{const m=$("#scmsg"); if(m)m.textContent=t};
  $("#scx").onclick=()=>{stop();closeSheet()};
  const done=text=>{stop();closeSheet();openScanned(text,mode)};
  $("#scfile").onchange=async()=>{
    const f=$("#scfile").files&&$("#scfile").files[0]; if(!f)return;
    msg("Reading the photo…");
    try{
      const still=await loadStill(f);
      const text=await decodeFrame(still);
      if(text)return done(text);
      msg("No code found in that photo. Fill the frame with the label and try again.");
    }catch(e){ msg(e.message==="no network"?"The reader needs a connection the first time it is used.":"Could not read that photo.") }
  };
  if(!canLive)return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v=$("#scv"); if(!v){stop();return} v.srcObject=stream; await v.play();
    if(!hasDetector()){ try{ await jsqrLib() }catch(e){ msg("The reader needs a connection the first time it is used. Until then, use the camera app."); return } }
    const tick=async()=>{ if(!stream)return;
      try{ const text=await decodeFrame(v); if(text)return done(text) }catch(e){}
      setTimeout(tick,hasDetector()?250:120) };
    tick();
  }catch(e){ msg("The camera could not be opened here. Use the camera app instead."); const v=$("#scv"); if(v)v.style.display="none" }
}

/* the click hook, checked first */
function appExtraClick(e){
  const t=e.target;
  const st=t.closest("[data-scenestab]"); if(st){scenesTab=st.dataset.scenestab; view="active"; render(); return true}
  if(t.closest("[data-setuphide]")){S.setupHide=new Date().toISOString(); save(); render(); return true}
  const df=t.closest("[data-dfold]"); if(df){S.dataOpen=S.dataOpen||{}; const k=df.dataset.dfold; S.dataOpen[k]=!((k in S.dataOpen)?S.dataOpen[k]:DATA_OPEN.has(k)); saveLocal(); const y=scrollY; renderData(); scrollTo(0,y); return true}
  if(t.closest("[data-sweepnext]")){const nx=nextUnchecked(S.curLoc); if(!nx)return toast("Nothing left to check"),true;
    S.curLoc=nx.code; S.pick=false; S.lastCat=""; save(); renderSweep(); const f=$("#q-name")||$("#f-name"); if(f)f.focus(); return true}
  const sd=t.closest("[data-sweepdone]"); if(sd){const code=sd.dataset.sweepdone; const r=regUncounted(code);
    if(r.length){toast("Count the regulated items first"); countSheet(code,r); return true} markSweptNext(code); return true}
  const ck=t.closest("[data-check]"); if(ck){const r=regUncounted(ck.dataset.check); if(r.length){toast("Count the regulated items first"); countSheet(ck.dataset.check,r); return true} return false}
  const qy=t.closest("[data-qty]"); if(qy){const [id,d]=qy.dataset.qty.split(":"); const i=S.items.find(x=>x.id===id); if(!i)return true;
    setQty(i,n(i.qty)+(+d)); save(); const y=scrollY; renderInventory(); scrollTo(0,y); return true}
  const qo=t.closest("[data-qout]"); if(qo){const i=S.items.find(x=>x.id===qo.dataset.qout); if(!i)return true;
    if(isOut(i)){i.status="Stocked"; i.qty=String(Math.max(1,n(i.par))); toast(i.name+" back in stock at "+i.qty)} else {i.status="Out"; i.qty="0"; toast(i.name+" marked out")}
    logAct("stock",i.name+(isOut(i)?" marked out":" restocked")); save(); const y=scrollY; renderInventory(); scrollTo(0,y); return true}
  if(t.closest("[data-verifyrun]")){closeSheet(); verifyRun(); return true}
  if(t.closest("[data-countrun]")){closeSheet(); countRun(); return true}
  const ca=t.closest("[data-countall]"); if(ca){countSheet(ca.dataset.countall); return true}
  const cn=t.closest("[data-countnow]"); if(cn){const i=S.items.find(x=>x.id===cn.dataset.countnow); if(i)countSheet(i.loc||"",[i]); return true}
  const el=t.closest("[data-editlot]"); if(el){const i=S.items.find(x=>x.id===el.dataset.editlot); if(i)lotSheet(i); return true}
  const od=t.closest("[data-ordered]"); if(od){const i=S.items.find(x=>x.id===od.dataset.ordered); if(i){i.ordered=today(); logAct("reorder","Ordered "+i.name); save(); renderReorder()} return true}
  const rc=t.closest("[data-received]"); if(rc){const i=S.items.find(x=>x.id===rc.dataset.received); if(i){
      const need=Math.max(n(i.par)-n(i.qty),1); setQty(i,n(i.qty)+need);
      if(i.status==="Expired"||i.status==="Service due")i.status="Stocked";
      // new stock in hand means the old expiry/service date no longer applies until re-set
      if(i.date&&daysOut(i.date)!==null&&daysOut(i.date)<=0)i.date="";
      delete i.ordered;
      logAct("reorder","Received "+i.name); save(); renderReorder(); toast(i.name+" now "+i.qty+" in stock")} return true}
  const uo=t.closest("[data-unordered]"); if(uo){const i=S.items.find(x=>x.id===uo.dataset.unordered); if(i){delete i.ordered; save(); renderReorder()} return true}
  if(t.closest("[data-doprint]")){window.print&&window.print(); return true}
  const sc=t.closest("[data-scan]"); if(sc){scanSheet(sc.dataset.scan); return true}
  const lk=t.closest("[data-labelkind]"); if(lk){S.labelKind=lk.dataset.labelkind; saveLocal(); renderLabels(); return true}
  const lb=t.closest("[data-labelbay]"); if(lb){S.labelBay=lb.dataset.labelbay; saveLocal(); renderLabels(); return true}
  return false;
}

/* ---------- tab headers, in the style of the home dashboard ---------- */
function tabHead(name,facts){
  return `<div class="hhead"><b>${esc(name)}</b>${facts.filter(Boolean).map(f=>`<span>${f}</span>`).join("")}</div>`;
}
function tabTiles(t){
  return `<div class="stiles">${t.map(([cls,k,v,s,attr])=>`<button class="stile ${cls}" ${attr||""}><span class="sk">${k}</span><span class="sv">${v}</span><span class="ss">${s}</span></button>`).join("")}</div>`;
}
function scenesHead(){
  const o=openIncidents().length, c=closedIncidents().length, l=openDocs().length, p=unsent().length;
  return tabHead("Scenes",[o+" open",c+" closed",p?p+" not exported":""])+tabTiles([
    ["t-plain","Open",String(o),o?"incident"+(o===1?"":"s")+" in progress":"nothing in progress",'data-scenestab="open"'],
    ["t-plain","Closed",String(c),c?"finished, kept for the record":"none finished yet",'data-scenestab="closed"'],
    [l?"t-amber":"t-calm","Not filed",l?String(l):"None",l?"document"+(l===1?"":"s")+" outside an incident":"everything is filed",'data-scenestab="open"'],
    [p?"t-red":"t-calm","Not exported",p?String(p):"None",p?"only on this device so far":"all exported",'data-scenestab="open"']]);
}
let guideFilter="all";
function guideHead(){
  const L=live(), withS=L.concat(requests()).filter(i=>(i.steps||[]).length);
  const ok=withS.filter(i=>i.verified&&!isStale(i)).length, unver=withS.filter(i=>!i.verified).length,
        stale=withS.filter(i=>isStale(i)).length, none=L.filter(i=>!(i.steps||[]).length).length;
  const chip=(k,l)=>`<button data-gfilter="${k}" class="${guideFilter===k?"sel":""}">${l}</button>`;
  return tabHead("Guide",[withS.length+" set"+(withS.length===1?"":"s")+" of instructions",ok+" verified"])+tabTiles([
    ["t-plain","Verified",String(ok),ok?"checked within the year":"none yet",'data-gfilter="ok"'],
    [unver?"t-amber":"t-calm","Unverified",unver?String(unver):"None",unver?"never checked against a sheet":"all have a date",'data-gfilter="unver"'],
    [stale?"t-red":"t-calm","Re-check",stale?String(stale):"None",stale?"last checked over a year ago":"nothing overdue",'data-gfilter="stale"'],
    [none?"t-dark":"t-calm","No instructions",none?String(none):"None",none?"item"+(none===1?"":"s")+" with nothing written":"every item covered",'data-gfilter="none"']])
    +`<div class="filters">${chip("all","All")}${chip("ok","Verified")}${chip("unver","Unverified")}${chip("stale","Re-check")}${chip("none","No instructions")}</div>`;
}
function storageHead(){
  const cs=comps(), st=cs.map(c=>compState(c.code));
  const bays=new Set(cs.map(c=>bayOf(c.code))).size, unchk=st.filter(s=>s.k==="unchecked").length;
  const act=st.filter(s=>s.k==="action").length, att=st.filter(s=>s.k==="attn").length;
  const unnamed=cs.filter(c=>!(c.desc||"").trim()), lastMark=cs.map(c=>c.checked).filter(Boolean).sort().pop();
  return tabHead("Storage",[cs.length+" compartments in "+bays+" bay"+(bays===1?"":"s"),lastMark?"last sweep mark "+esc(lastMark):"no sweep yet"])+tabTiles([
    [unchk?"t-amber":"t-calm","Sweep",unchk?unchk+" left":"Done",unchk?(cs.length-unchk)+" of "+cs.length+" checked":"every compartment checked",'data-go="sweep"'],
    [act?"t-red":"t-calm","Need action",act?String(act):"None",act?"with something out or expired":"nothing out or expired",'data-list="low"'],
    [att?"t-amber":"t-calm","Attention",att?String(att):"None",att?"low, expiring or due for service":"nothing to watch",'data-list="expiring"'],
    [unnamed.length?"t-dark":"t-calm","Unnamed",unnamed.length?String(unnamed.length):"None",unnamed.length?"open the bay and name them":"every compartment named",unnamed.length?'data-bay="'+esc(bayOf(unnamed[0].code))+'"':'data-go="compartments"']]);
}
function itemsHead(){
  const L=live(), short=L.filter(i=>isOut(i)||isLow(i)).length, soon=L.filter(i=>isExpiring(i)||isExpired(i)||isService(i)).length;
  const un=L.filter(i=>!placed(i)).length, cats=new Set(L.map(i=>i.cat)).size;
  return tabHead("Items",[L.length+" carried",cats+" categor"+(cats===1?"y":"ies")])+tabTiles([
    ["t-plain","Items",String(L.length),"in the van",'data-invg="az"'],
    [short?"t-red":"t-calm","Short",short?String(short):"None",short?"low or out, tap to see":"nothing low or out",'data-invg="status"'],
    [soon?"t-amber":"t-calm","Expiring",soon?String(soon):"None",soon?"within 90 days or service due":"all dates clear",'data-list="expiring"'],
    [un?"t-dark":"t-calm","Not placed",un?String(un):"None",un?"no compartment yet":"everything has a home",'data-invg="loc"']]);
}

function snippets(){
  if(!Array.isArray(S.snippets)||!S.snippets.length){ S.snippets=SNIPPET_DEFAULTS.map(([name,text])=>({id:newId(),name,text})); saveLocal() }
  return S.snippets;
}
function snippetSheet(fieldId){
  const list=snippets();
  openSheet(`<h3>Insert wording</h3>
    <p class="hint" style="margin:0 0 12px">Tap a line to insert it at the cursor. Square brackets mark what to fill in. The library is under Settings › Report wording.</p>
    <div class="rows">${list.map(s=>`<button class="row" data-snipins="${s.id}"><span><span class="code">${esc(s.name)}</span><span class="desc">${esc(s.text.slice(0,96))}${s.text.length>96?"…":""}</span></span><span class="rt"><span class="chev">&#8250;</span></span></button>`).join("")}</div>
    <button class="btn sec" id="snx" style="max-width:none;margin:12px 0 0">Cancel</button>`);
  $("#snx").onclick=closeSheet;
  $$("[data-snipins]").forEach(b=>b.onclick=()=>{
    const s=list.find(x=>x.id===b.dataset.snipins), ta=document.querySelector(`textarea[data-fv="${fieldId}"]`);
    if(!s||!ta)return closeSheet();
    const st=ta.selectionStart??ta.value.length, en=ta.selectionEnd??st;
    const before=ta.value.slice(0,st), after=ta.value.slice(en), sep=before&&!/\s$/.test(before)?" ":"";
    ta.value=before+sep+s.text+after;
    ta.dispatchEvent(new Event("input",{bubbles:true}));
    closeSheet(); ta.focus(); const pos=(before+sep+s.text).length; try{ta.setSelectionRange(pos,pos)}catch(_){}
  });
}
