<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FSU</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FSU">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html{color-scheme:light dark}
html.theme-dark{color-scheme:dark}
html.theme-light{color-scheme:light}
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;
  --ink:#000000;--ink2:#6C6C70;--ink3:#6C6C70;
  --line:#D8D8DC;--line2:#E8E8ED;
  --blue:#0A62C4;--bluebg:#E8F0FB;
  --red:#D62B20;--redbg:#FDECEA;--redink:#A8261C;--redsolid:#D93A2E;
  --amber:#8F5400;--amberbg:#FDF2E0;--ambersolid:#E8890B;--onamber:#12100A;--onblue:#FFFFFF;--metal:#8E8E93;
  --green:#1E8A45;--greenbg:#E7F5EC;--greenink:#156632;--greensolid:#22A153;
  --grey:#6C6C70;--greybg:#EFEFF2;
  --dark:#22262B;--darkink:#FFFFFF;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --cw:1760px;
  --kpv:#111111;
  --top:calc(100px + env(safe-area-inset-top));
  --bot:calc(74px + env(safe-area-inset-bottom));
  /* one spacing scale, one type scale, one radius scale, one tap size.
     Everything shared across views is sized from these, not from its own number. */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --f0:11px;--f1:12.5px;--f2:13.5px;--f3:15px;--f4:17px;--f5:21px;--f6:26px;
  --r1:10px;--r2:14px;--r3:20px;
  --tap:44px;
}
/* dark applies automatically, unless the person has chosen otherwise */
@media (prefers-color-scheme:dark){html:not(.theme-light){
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;
  --ink:#FFFFFF;--ink2:#AEAEB2;--ink3:#9A9AA0;
  --line:#38383A;--line2:#2C2C2E;
  --blue:#57A6FF;--bluebg:#132A44;
  --red:#FF6B5E;--redbg:#3A1B18;--redink:#FF6B5E;--redsolid:#C7382C;
  --amber:#F0A93B;--amberbg:#3A2A10;--ambersolid:#B87209;--onamber:#12100A;--onblue:#12100A;--metal:#8E8E93;
  --green:#4CD07D;--greenbg:#13301F;--greenink:#4CD07D;--greensolid:#1C8746;
  --grey:#9A9AA0;--greybg:#2C2C2E;
  --dark:#3A3F45;--darkink:#FFFFFF;
  --kpv:#E8E8E8;
}}
html.theme-dark{
  --kpv:#E8E8E8;
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;
  --ink:#FFFFFF;--ink2:#AEAEB2;--ink3:#9A9AA0;
  --line:#38383A;--line2:#2C2C2E;
  --blue:#57A6FF;--bluebg:#132A44;
  --red:#FF6B5E;--redbg:#3A1B18;--redink:#FF6B5E;--redsolid:#C7382C;
  --amber:#F0A93B;--amberbg:#3A2A10;--ambersolid:#B87209;--onamber:#12100A;--onblue:#12100A;--metal:#8E8E93;
  --green:#4CD07D;--greenbg:#13301F;--greenink:#4CD07D;--greensolid:#1C8746;
  --grey:#9A9AA0;--greybg:#2C2C2E;
  --dark:#3A3F45;--darkink:#FFFFFF;
}
html.theme-light{  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;
  --ink:#000000;--ink2:#6C6C70;--ink3:#6C6C70;
  --line:#D8D8DC;--line2:#E8E8ED;
  --blue:#0A62C4;--bluebg:#E8F0FB;
  --red:#D62B20;--redbg:#FDECEA;--redink:#A8261C;--redsolid:#D93A2E;
  --amber:#8F5400;--amberbg:#FDF2E0;--ambersolid:#E8890B;--onamber:#12100A;--onblue:#FFFFFF;--metal:#8E8E93;
  --green:#1E8A45;--greenbg:#E7F5EC;--greenink:#156632;--greensolid:#22A153;
  --grey:#6C6C70;--greybg:#EFEFF2;
  --dark:#22262B;--darkink:#FFFFFF;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --cw:1760px;
  --top:calc(100px + env(safe-area-inset-top));
  }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sys);
  font-size:17px;line-height:1.4;padding-top:var(--top);padding-bottom:var(--bot);
  overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}

.hdr{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--card);
  border-bottom:.5px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 12px}
.titlerow{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.hdr h1{font-size:var(--f6);font-weight:700;letter-spacing:-.022em;margin:0;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gear{background:none;border:0;color:var(--blue);padding:4px;flex:0 0 auto}
#gear svg{width:23px;height:23px;display:block}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card2);
  border:.5px solid var(--line2);border-radius:10px;padding:9px 12px}
.sbox input{border:0;background:none;outline:none;flex:1;padding:0;font-size:16px}
.sbox input::placeholder{color:var(--ink3)}
.sbox svg{width:17px;height:17px;color:var(--ink3);flex:0 0 auto}
.sbox button{background:none;border:0;color:var(--blue);font-size:15px;padding:0 2px}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bg);
  border-top:.5px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
  gap:5px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
/* each tab reads as a button, like everything else in the app */
.tabs button{background:var(--card);border:.5px solid var(--line);border-radius:11px;
  padding:7px 2px 6px;color:var(--ink3);
  font-size:9.5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:0;overflow:hidden;min-height:50px;justify-content:center;position:relative}
.tabs button:active{background:var(--card2)}
.tdot{position:absolute;top:3px;left:50%;margin-left:5px;min-width:15px;height:15px;
  border-radius:8px;background:var(--amber);color:#1a1200;font-size:9.5px;font-weight:800;
  font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 3px}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:360px){ .tabs{gap:4px;padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
  .tabs button{font-size:8.5px;border-radius:9px} .tabs .g{width:19px;height:19px} }
.tabs button[aria-current=true]{color:var(--blue);background:var(--bluebg);
  border-color:var(--blue)}
.g{width:22px;height:22px;display:block}

.side{display:none}
.view{display:none;padding:14px 16px 30px}
.view.on{display:block}


body.wide{padding:0;display:grid;grid-template-columns:232px minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);min-height:100vh}
body.wide .side{grid-column:1;grid-row:1 / -1}
body.wide .hdr{grid-column:2;grid-row:1;
  padding-left:calc(max(0px,(100% - var(--cw))/2) + 28px);
  padding-right:calc(max(0px,(100% - var(--cw))/2) + 28px)}
body.wide .main{grid-column:2;grid-row:2;align-self:start;
  max-width:var(--cw);margin:0 auto;width:100%}
body.wide .tabs{display:none}
body.wide .hdr{position:sticky;grid-column:2;
  padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:14px}
body.wide .titlerow{margin:6px 0 12px}
body.wide .side{display:flex;flex-direction:column;gap:2px;background:var(--card);
    border-right:.5px solid var(--line);padding:calc(20px + env(safe-area-inset-top)) 0 20px;
    position:sticky;top:0;height:100vh}
body.wide .side button{background:none;border:0;color:var(--ink3);padding:12px 4px;
    font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px}
body.wide .side button[aria-current=true]{color:var(--blue)}
body.wide .side .g{width:24px;height:24px}
body.wide .main{grid-column:2;min-width:0;padding-bottom:40px}
body.wide .view{padding:6px 28px 60px}
body.wide .demobar{border-radius:10px;
  margin-left:calc(max(0px,(100% - var(--cw))/2) + 28px);
  margin-right:calc(max(0px,(100% - var(--cw))/2) + 28px)}


/* ---------- priority strip ---------- */
.strip{display:flex;flex-direction:column;gap:10px}

body.wide .strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcard{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;border:0;
  border-radius:var(--r2);padding:var(--s4);color:#fff}
.pcard:active{opacity:.9}
.pcard .n{display:block;font-size:var(--f5);font-weight:700;letter-spacing:-.02em;line-height:1.18}
.pcard .s{display:block;font-size:var(--f2);opacity:.92;margin-top:var(--s1);line-height:1.3}
.pcard .ch{margin-left:auto;font-size:20px;opacity:.85}
.pcard svg{width:22px;height:22px;flex:0 0 auto}
.p-red{background:var(--redsolid)}
.p-amber{background:var(--ambersolid)}
.p-dark{background:var(--dark);color:var(--darkink)}
.p-green{background:var(--greensolid)}

body.wide .pcard{flex-direction:column;align-items:flex-start;gap:6px;padding:18px;min-height:118px}
body.wide .pcard .n{font-size:34px}
body.wide .pcard .ch{display:none}
body.wide .pcard svg{width:24px;height:24px;margin-bottom:2px}


.skmain{min-width:0}
body.skfull{overflow:hidden}
body.skfull .skgrid.full{position:fixed;inset:0;z-index:80;background:var(--bg);
  padding:10px;gap:10px;display:grid;grid-template-rows:minmax(0,1fr) auto;
  grid-template-columns:minmax(0,1fr);overflow:hidden;
  align-items:stretch;align-content:stretch}
.skgrid.full .skmain{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.skgrid.full .canvaswrap{margin:0 auto;padding:0;overflow:hidden;flex:0 0 auto}
.skgrid.full .skcanvas{width:100%;height:100%;display:block}
.skgrid.full .skrail{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.skgrid.full .editbar{margin:0;flex:0 0 auto}
.skgrid.full .inkrow{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.inkrow .inklab{font-size:12.5px;color:var(--ink2);margin-right:2px}
.ink{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0;flex:0 0 auto}
.ink.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--bluebg)}
.skgrid.full .objset{flex:0 0 auto;max-height:40vh;overflow-y:auto}
.skgrid.full .cdhead,.skgrid.full .back{display:none}
@media (max-width:899px){ .skgrid.full .skrail{max-height:38vh} }
/* full screen: the sticky, start-aligned rules of the normal wide layout must not apply, or the canvas shrinks to its toolbar */
body.skfull .skgrid.full .skmain{position:static;top:auto;align-self:stretch}
body.skfull .skgrid.full .skrail{position:static;top:auto;max-height:100%}
body.skfull .skgrid.full.notools{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.skgrid.full.notools .skrail,.skgrid.full.notools .objset{display:none}
@media (min-width:900px){
  body.skfull .skgrid.full{grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr)}
  .skgrid.full .skrail{max-height:100%}
}
.editbar button[disabled]{opacity:.38}
.editbar button.on{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.canvaswrap{background:var(--card);border:.5px solid var(--line);border-radius:12px;
  padding:6px;margin-bottom:10px;touch-action:none}
.skcanvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:none;
  -webkit-user-select:none;user-select:none}
.k-line{fill:none;stroke:var(--kc,#111);stroke-width:2.5}
.k-thin{fill:none;stroke:var(--kc,#111);stroke-width:1.2}
.k-thick{fill:none;stroke:var(--kc,#111);stroke-width:4;stroke-linecap:round}
.k-stroke{fill:none;stroke:var(--kc,#111);stroke-width:2}
.k-dash{fill:none;stroke:var(--kc,#111);stroke-width:2;stroke-dasharray:8 6}
.k-solid{fill:var(--kc,#111);stroke:none}
.k-fill{fill:var(--kc,#111);stroke:none}
.k-text{fill:var(--kc,#111);font-family:var(--sys);font-weight:600}
.k-tag,.k-label,.k-text{paint-order:stroke fill;stroke:#fff;stroke-width:3.2px;
  stroke-linejoin:round}
.k-tag{fill:var(--kc,#111);font-family:var(--sys);font-size:15px;text-anchor:middle}
.k-lead{stroke:var(--kc,#111);stroke-width:1;opacity:.55}
.hcase{fill:#111;font-family:var(--sys);font-size:27px;font-weight:700;letter-spacing:-.5px}
.haddr{fill:#111;font-family:var(--sys);font-size:16px}
.hmeta{fill:#444;font-family:var(--sys);font-size:14px}
.tbbox{stroke:#111;stroke-width:1.6;fill:none}
.tbrule{stroke:#999;stroke-width:.8}
.tbunit{font-family:var(--sys);font-size:7.6px;font-weight:700;letter-spacing:.03em;fill:#111}
.tblab{font-family:var(--sys);font-size:7.5px;font-weight:700;letter-spacing:.07em;fill:#666}
.tbval{font-family:var(--sys);font-size:11.5px;fill:#111}
.tbbig{font-family:var(--sys);font-size:17px;font-weight:700;fill:#111}
.k-credit{fill:#555;font-family:var(--sys);font-size:9.5px}
.k-dim{stroke:var(--kc,#111);stroke-width:1.6;fill:none}
.k-dimbg{fill:#fff;stroke:var(--kc,#111);stroke-width:.8}
.k-dimt{fill:var(--kc,#111);font-family:var(--sys);font-size:10px;font-weight:600}
.k-pnum{fill:#111;font-family:var(--sys);font-size:11px;font-weight:700}
.k-num{fill:var(--kc,#111);font-family:var(--sys);font-size:22px;font-weight:800;text-anchor:middle}
.k-sel{fill:none;stroke:#0A62C4;stroke-width:2.5;stroke-dasharray:7 5}
.k-handle{fill:#0A62C4;stroke:#fff;stroke-width:2.5}
.k-rot{fill:#0A62C4;stroke:#fff;stroke-width:2.5;cursor:grab}
.k-rotstem{stroke:#0A62C4;stroke-width:2;stroke-dasharray:3 3}
.skhead{pointer-events:none}
.k-legt{fill:var(--kc,#111);font-family:var(--sys);font-weight:700}
.k-legn{fill:var(--kc,#111);font-family:var(--sys);font-weight:700}
.k-legr{fill:var(--kc,#111);font-family:var(--sys)}
.k-legu{fill:#8a8a8a;font-family:var(--sys);font-style:italic}
.laygrp{border:.5px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.laygrp.cur{border-color:var(--blue)}
.layhead{display:flex;align-items:center;gap:4px;background:var(--card2,var(--card));
  padding:3px 4px 3px 0;border-bottom:.5px solid var(--line)}
.layhead .laypick{font-weight:700}
.laycount{margin-left:auto;font-size:11.5px;color:var(--ink3);padding:0 8px}
.layb.lockon{color:var(--amber)}
.laybig{background:none;border:0;color:var(--ink3);min-width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.laybig.lockon{color:var(--amber)}
.layhead .laypick,.lay .laypick{min-height:46px}
.laycount{margin-left:0;font-size:11.5px;color:var(--ink3);padding:0;display:block}
.layhead .laypick{flex-direction:column;align-items:flex-start;gap:1px;padding:7px 12px}
.lki{width:15px;height:15px;display:block;margin:0 auto}
.lay.locked{opacity:.55}
.osclose{background:none;border:0;color:var(--ink3);font-size:22px;line-height:1;
  padding:0 2px 0 10px;margin-left:auto}
.addlay{background:var(--bluebg);border:.5px solid var(--blue);border-radius:var(--r1);
  color:var(--blue);font-family:var(--sys);font-size:var(--f2);font-weight:600;
  padding:var(--s3) var(--s4);min-height:var(--tap);text-transform:none;letter-spacing:0;margin-left:auto}
.sect:has(.addlay){display:flex;align-items:center;gap:10px}
.layers{background:var(--card);border:.5px solid var(--line2);border-radius:11px;overflow:hidden}
.lay{display:flex;align-items:center;border-bottom:.5px solid var(--line2)}
.lay:last-child{border-bottom:0}
.lay.on{background:var(--bluebg)}
.laypick{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:0;
  padding:7px 4px 7px 9px;text-align:left}
.lay .lp{width:40px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.lay .lp .pvs{width:38px;height:24px}
.lay .ln2{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layb{background:none;border:0;color:var(--ink3);font-size:12px;padding:8px 5px;flex:0 0 auto}
.layb.del{color:var(--red);font-size:17px;padding-right:9px}
.layb[disabled]{opacity:.25}
@media (hover:hover) and (pointer:fine){.layb:hover:not([disabled]){color:var(--blue)}
  .laypick:hover{background:var(--card2)}}
.objset{background:var(--card);border:.5px solid var(--line2);border-radius:12px;padding:12px 13px}
.oshead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.oshead b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.oshead .osr{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.oshead .osr span{font-family:var(--mono);color:var(--ink)}
.osgrid{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:end}
.osgrid .osname{grid-column:1/-1}
.osgrid .osnum+.osname{grid-column:2}
.osgrid .fld{margin:0}
.objbar{margin-top:10px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.objbar button{flex:0 0 auto;background:var(--card);border:.5px solid var(--line);
  border-radius:var(--r1);padding:var(--s3);min-height:var(--tap);font-size:var(--f3);
  font-weight:600;color:var(--blue);white-space:nowrap}
.objbar button.danger{color:var(--red);border-color:var(--red)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-bottom:6px}
.steps{margin:0;padding-left:20px;color:var(--ink2);font-size:14px;line-height:1.55}
.steps li{margin-bottom:7px}
.steps b{color:var(--ink)}
.numnext{background:var(--bluebg);border:.5px solid var(--blue);border-radius:10px;
  color:var(--blue);font-size:13.5px;font-weight:600;padding:9px 12px;align-self:end;white-space:nowrap}
.sugbox{display:flex;flex-direction:column;gap:0;margin:-6px 0 12px}
.sugbox:empty{display:none}
.sug{background:var(--card);border:.5px solid var(--line);border-top:0;color:var(--ink);
  font-family:var(--sys);font-size:var(--f3);text-align:left;padding:var(--s3) var(--s4);min-height:var(--tap)}
.sug:first-child{border-top:.5px solid var(--line);border-radius:11px 11px 0 0}
.sug:last-child{border-radius:0 0 11px 11px}
.sug:only-child{border-radius:11px}
.palsearch{position:relative;margin:0 0 10px}
.palsearch input{width:100%;padding:10px 34px 10px 12px;font-size:15px}
.palsearch button{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:none;border:0;color:var(--ink3);font-size:20px;padding:0 6px}
.palette .pg{display:block;font-size:10px;color:var(--ink3);margin-top:1px}
.palette button{background:var(--card);border:.5px solid var(--line2);border-radius:11px;
  padding:9px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:5px}
.palette .pv{height:32px;display:flex;align-items:center;justify-content:center}
.pvs{width:46px;height:32px;display:block;overflow:visible}
.palette .pn{font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.2}
/* previews sit on the card, not on paper: the ink follows the theme unless the object has its own */
.pvs .k-line,.pvs .k-stroke,.pvs .k-thin,.pvs .k-thick,.pvs .k-dash,.pvs .k-ink{stroke:var(--kc,var(--kpv))}
.pvs .k-solid,.pvs .k-fill,.pvs .k-text,.pvs .k-tag,.pvs .k-num{fill:var(--kc,var(--kpv))}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--greybg);
  border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{background:none;border:0;padding:var(--s2) var(--s2);min-height:var(--tap);border-radius:var(--r1);
  font-size:var(--f3);font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.plotwrap{background:var(--card);border:.5px solid var(--line2);border-radius:14px;
  padding:10px;margin-bottom:6px;overflow-x:auto}
.plot{width:100%;height:auto;display:block}
.plot .gl{stroke:var(--line2);stroke-width:1}
.plot .pf{fill:none;stroke:var(--line);stroke-width:1}
.plot .rp{fill:var(--ink2)}
.plot .rt{fill:var(--ink2);font-size:10px;font-family:var(--sys)}
.plot .ip{fill:var(--blue)}
.plot .in{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;font-family:var(--sys)}
.plot .na{stroke:var(--ink2);stroke-width:1.5}
.plot .naf{fill:var(--ink2)}
.sweepcard{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  background:var(--card);border:.5px solid var(--line2);border-radius:var(--r2);
  padding:var(--s4);margin-top:var(--s3)}
.sweepcard .n{display:block;font-size:var(--f4);font-weight:600;letter-spacing:-.01em}
.sweepcard .s{display:block;font-size:var(--f2);color:var(--ink2);margin-top:2px}
.sweepcard .ch{margin-left:auto;color:var(--ink3);font-size:18px}
.sweepcard.live{border-color:var(--amber);background:var(--amberbg)}
.sweepcard.live .n{color:var(--amber)}
.sweepcard.live .s{color:var(--amber);opacity:.9}
.sect{font-size:var(--f2);font-weight:600;color:var(--ink2);margin:var(--s5) 2px var(--s2)}
.subsect{font-size:var(--f1);font-weight:600;color:var(--ink3);margin:var(--s4) 2px var(--s1)}
.qf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.qf button{background:var(--card);border:.5px solid var(--line2);border-radius:var(--r2);
  padding:var(--s3) var(--s4);text-align:left;min-height:84px;display:flex;flex-direction:column}
.qf .nm{font-size:var(--f3);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.qf .lc{font-size:var(--f2);color:var(--blue);font-weight:600;margin-top:auto;padding-top:var(--s2)}

/* ---------- rows ---------- */
.rows{background:var(--card);border-radius:var(--r2);border:.5px solid var(--line2);overflow:hidden}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:none;
  border:0;border-bottom:.5px solid var(--line2);padding:var(--s3) var(--s4);min-height:var(--tap)}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.row .code{font-size:var(--f4);font-weight:600;letter-spacing:-.01em;display:block;line-height:1.3}
.row .desc{font-size:var(--f2);color:var(--ink2);margin-top:1px;display:block;line-height:1.3}
.row .rt{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex:0 0 auto}
.badge .bico{width:14px;height:14px;flex:0 0 auto;margin-right:5px;vertical-align:-2px}
.badge.b-unchecked .bico{color:var(--amber)}
.cdtags .badge{display:inline-flex;align-items:center;font-size:var(--f1);padding:var(--s1) var(--s3);
  border-radius:20px;font-weight:600}
.badge{font-size:var(--f1);font-weight:600;padding:var(--s1) var(--s2);border-radius:20px;white-space:nowrap}
.b-action{background:var(--redbg);color:var(--red)}
.b-attn{background:var(--amberbg);color:var(--amber)}
.b-good{background:var(--greenbg);color:var(--green)}
.b-unchecked{background:var(--greybg);color:var(--grey)}
.b-req{background:var(--bluebg);color:var(--blue)}
.links{background:var(--card);border:.5px solid var(--line2);border-radius:var(--r2);overflow:hidden}
.lnk{display:block;padding:var(--s3) var(--s4);min-height:var(--tap);border-bottom:.5px solid var(--line2);
  text-decoration:none;color:inherit}
.lnk:last-child{border-bottom:0}
.lnk .ln{display:block;font-size:var(--f3);font-weight:500;color:var(--blue);line-height:1.3}
.lnk .lu{display:block;font-size:var(--f1);color:var(--ink2);margin-top:1px}
.chev{color:var(--ink3);font-size:16px}

/* ---------- van walls ---------- */
.wall{margin-bottom:14px;container-type:inline-size;container-name:wall}
.slot.small{padding:2px 4px;gap:0}
.slot.small .code{font-size:11px;line-height:1.1}
.slot.small .st{font-size:9.5px;line-height:1.1}
.slot.tiny{padding:0 1px;gap:0;border-radius:2px;align-items:center;justify-content:center}
.slot.small{border-radius:4px}
.slot.tiny .code{font-size:9.5px;line-height:1}
.wallhead{display:flex;align-items:center;gap:10px}
.wallhead b{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.wallhead .cnt{font-size:12.5px;color:var(--ink3);font-weight:400}
.wallhead .wtags{margin-left:auto;display:flex;gap:5px}
.wallhead .badge{padding:2px 8px}
.vanwrap.mirrored .vanbody{transform:scaleX(-1)}
.vanwrap.mirrored .cargo{transform:scaleX(-1)}
.vanwrap{position:relative;aspect-ratio:2.55/1;max-height:420px;margin-bottom:4px}
@media (max-width:820px){ .vanwrap{aspect-ratio:1.62/1;max-height:none} }
.vanbody{position:absolute;left:0;right:0;top:0;height:87%;z-index:1;background:var(--metal);
  clip-path:polygon(0% 92%,0% 64%,2% 42%,9% 38%,17% 0%,100% 0%,100% 92%)}
.vaninner{position:absolute;inset:0;background:var(--card2);
  clip-path:polygon(1% 90%,1% 65%,3% 43.5%,9.6% 39.5%,17.9% 1.6%,99% 1.6%,99% 90%)}
.wheel{position:absolute;border-radius:50%;background:var(--card2);
  border:2.5px solid var(--metal);height:19%;aspect-ratio:1;width:auto;top:71%}
.wheel.f{left:8%}.wheel.r{left:76%}
.cargo{position:absolute;left:19%;right:2.5%;top:7%;bottom:13%;display:grid;gap:3px;overflow:hidden}
.slot{border-radius:6px;padding:4px 5px;text-align:left;border:.5px solid transparent;
  overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;gap:1px;
  container-type:size;container-name:slot}
.slot>span{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.slot .code{font-size:11.5px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.slot .dsc{font-size:10px;opacity:.85;line-height:1.2;margin-top:1px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;min-height:0}
.slot .dsc.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;text-overflow:clip}
.slot .st{font-size:10px;font-weight:600;line-height:1.2;margin-top:auto;flex:0 0 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-action{background:var(--redbg);color:var(--red);border-color:var(--red)}
.s-attn{background:var(--amberbg);color:var(--amber);border-color:var(--amber)}
.s-good{background:var(--greenbg);color:var(--green);border-color:var(--green)}
.s-unchecked{background:var(--greybg);color:var(--grey);border-color:var(--line)}
.slot.sel{outline:2.5px solid var(--blue);outline-offset:1px}
.orient{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin:0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 2px 16px;font-size:12.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.demobar{background:var(--amberbg);color:var(--amber);padding:11px 16px;font-size:13px;
  display:flex;align-items:center;gap:12px;line-height:1.35}
.demobar span{flex:1;min-width:0}
.demobar.warn{background:var(--amberbg);color:var(--amber)}
.demobar.warn button{background:var(--amber);color:var(--card)}
.demobar.bad{background:var(--redbg);color:var(--red)}
.demobar.bad button{background:var(--red);color:#fff}
.chips button i{display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:7px;vertical-align:1px;background:var(--grey)}
.chips button.ch-good i{background:var(--green)}
.chips button.ch-attn i{background:var(--amber)}
.chips button.ch-action i{background:var(--red)}
.chips button.ch-unchecked i{background:var(--grey)}
.chips button.on i{background:#fff}
.demobar button{margin-left:auto;background:var(--amber);color:var(--card);border:0;
  border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;flex:0 0 auto}
.bayhead{display:grid;grid-template-columns:minmax(0,1fr) 122px;
  gap:var(--s1) var(--s4);align-items:start;
  background:var(--card);border:.5px solid var(--line2);border-radius:var(--r2);
  padding:var(--s4);margin-bottom:var(--s3);width:100%;text-align:left;
  color:inherit;font-family:inherit}
.bayinfo{min-width:0;grid-column:1;grid-row:1}
.bayinfo h2{font-size:var(--f5);font-weight:700;letter-spacing:-.02em;margin:0 0 var(--s1);line-height:1.15}
.bayinfo .sub{font-size:var(--f2);color:var(--ink2);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){ .bayinfo .sub{font-size:13.5px} .bayinfo h2{font-size:20px} }
@media (max-width:360px){
  .bayhead{grid-template-columns:minmax(0,1fr) 96px;padding:15px 16px;gap:5px 12px}
  .bayinfo .sub{font-size:12.5px}
}
.bayhead .vankey{grid-column:2;grid-row:1/-1;align-self:center}
.vankey .vanwrap{aspect-ratio:2.55/1;max-height:none;margin:0}
.vankey .here{background:var(--red);border:1px solid rgba(255,255,255,.85);border-radius:3px;
  box-shadow:0 0 12px 3px rgba(255,107,94,.55)}
.keyends{display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);
  font-family:var(--mono);margin-top:4px;white-space:nowrap}
.bayhead .cdtags{grid-column:1;grid-row:2;justify-content:flex-start;margin-top:var(--s2)}
.bayhead.mini{grid-template-columns:minmax(0,1fr) 88px;padding:var(--s3) var(--s4);
  margin-bottom:var(--s4);border-radius:var(--r2);gap:var(--s1) var(--s3)}
.bayhead.mini .bayinfo h2{font-size:var(--f4)}
.bayhead.mini .bayinfo .sub{font-size:var(--f1)}
.bayhead.mini .cdtags{margin-top:var(--s2)}
.bayhead.mini .badge{font-size:var(--f0);padding:var(--s1) var(--s3)}
@media (hover:hover) and (pointer:fine){.bayhead:hover{border-color:var(--line)}}
.cdtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bayplan{display:grid;gap:5px;margin-top:14px;
  grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  grid-template-rows:repeat(var(--rows),minmax(0,1fr));
  aspect-ratio:calc(var(--cols)/var(--rows)*0.72)}
.bcell{border-radius:9px;padding:6px 7px;text-align:left;overflow:hidden;min-width:0;min-height:0;
  display:flex;flex-direction:column;justify-content:center;gap:1px;
  border:1px solid var(--line);background:var(--card);
  container-type:size;container-name:bcell}
.bcell .bc{font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcell .bn{font-size:11px;color:var(--ink2);line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcell .bn.un{font-style:italic;color:var(--ink3)}
.bcell.s-good{background:var(--greenbg);border-color:var(--green)}
.bcell.s-attn{background:var(--amberbg);border-color:var(--amber)}
.bcell.s-action{background:var(--redbg);border-color:var(--red)}
.bcell .bn{display:none}
@container bcell (min-width:40px){ .bcell .bn{display:block} }
@container bcell (max-width:44px){ .bcell{padding:4px 4px} .bcell .bc{font-size:11px} }
@container bcell (max-width:30px){ .bcell .bc{font-size:9.5px;letter-spacing:-.3px} }
@container bcell (max-height:22px){ .bcell .bc{font-size:10.5px;line-height:1} .bcell .bn{display:none} }
.cdhead{background:var(--card);border:.5px solid var(--line2);border-radius:var(--r2);padding:var(--s4);margin-bottom:var(--s4)}
.cdhead h2{margin:0;font-size:var(--f6);font-weight:700;letter-spacing:-.02em}
.cdhead .sub{font-size:var(--f2);color:var(--ink2);margin-top:2px}
.cdstats{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.back{background:var(--card);border:.5px solid var(--line);border-radius:var(--r1);
  color:var(--blue);font-size:var(--f3);font-weight:600;padding:var(--s3) var(--s4);min-height:var(--tap);
  margin:0 0 var(--s4);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  white-space:nowrap;flex:0 0 auto}
@media (hover:hover) and (pointer:fine){.back:hover{border-color:var(--blue)}}
.acts{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.acts button{flex:1;padding:var(--s3) var(--s1);min-height:var(--tap);border-radius:var(--r1);
  border:.5px solid var(--line);background:var(--card);color:var(--blue);font-size:var(--f3);font-weight:600}
/* compartment detail: info and actions pinned left, the item list scrolls on the right */
.cd2{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s5);align-items:start}
.cdleft{position:sticky;top:0}
.cdacts{flex-direction:column}
.cdacts button{flex:none;width:100%}
@media (max-width:820px){.cd2{grid-template-columns:minmax(0,1fr)}.cdleft{position:static}.cdacts{flex-direction:row}.cdacts button{flex:1;width:auto}}
/* items, grouped by status: a column per status instead of stacked sections */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
@media (max-width:900px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kanban{grid-template-columns:1fr}}
.kcol h3{font-size:var(--f0);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
  display:flex;justify-content:space-between;margin:0 2px var(--s2)}
.kcol h3 .n{background:var(--card2);border-radius:20px;padding:1px var(--s2);font-size:var(--f0)}
.kcard{display:block;width:100%;text-align:left;background:var(--card);border:.5px solid var(--line2);
  border-radius:var(--r1);padding:var(--s3);margin-bottom:var(--s2);font-family:inherit;color:inherit}
.kcard b{display:block;font-size:var(--f2);font-weight:600}
.kcard span{display:block;font-size:var(--f1);color:var(--ink3);margin-top:2px}
/* item detail: identity, location and actions pinned left; everything else scrolls on the right */
.id2{display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--s5);align-items:start}
.idleft{position:sticky;top:0}
@media (max-width:820px){.id2{grid-template-columns:minmax(0,1fr)}.idleft{position:static}}
/* sweep, one compartment at a time */
.focuswrap{display:flex;flex-direction:column;align-items:center;padding:var(--s5) 0}
.focuscard{width:100%;max-width:480px;background:var(--card);border:.5px solid var(--line2);
  border-radius:var(--r3);padding:var(--s5);text-align:center}
.focuseyebrow{font-size:var(--f0);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:var(--s2)}
.focuscard .nowinfo{margin-bottom:var(--s4)}
.focuscard .nc{font-size:34px}
.focuscard .fld,.focuscard .two{text-align:left}
.focusline{margin-top:var(--s3);color:var(--ink3)}
/* reorder: progress toward everything being ordered */
.ropct{background:var(--card);border:.5px solid var(--line2);border-radius:var(--r2);padding:var(--s3) var(--s4);margin-bottom:var(--s4)}
.ropctlab{display:flex;justify-content:space-between;font-size:var(--f2);margin-bottom:var(--s2);color:var(--ink2)}
.ropctbar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden}
.ropctbar i{display:block;height:100%;background:var(--greensolid);border-radius:5px}
/* search: filters alongside results */
.searchsplit{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s5);align-items:start}
.searchrail{flex-direction:column;align-items:stretch;background:var(--card);border:.5px solid var(--line2);
  border-radius:var(--r2);padding:var(--s2);position:sticky;top:0}
.searchrail button{display:flex;justify-content:space-between;background:none;border-radius:var(--r1);
  padding:var(--s2) var(--s3);font-size:var(--f2);color:var(--ink2);font-weight:500}
.searchrail button.sel{background:var(--bluebg);color:var(--blue);font-weight:600}
.searchrail button .n{color:var(--ink3);font-weight:400}
.searchrail button.sel .n{color:var(--blue)}
@media (max-width:720px){.searchsplit{grid-template-columns:minmax(0,1fr)}.searchrail{position:static;flex-direction:row;overflow-x:auto}}
.ph.ok{background:var(--greenbg);color:var(--green)}
.ph{background:var(--bluebg);color:var(--blue);border-radius:var(--r1);padding:var(--s3) var(--s4);
  font-size:var(--f2);line-height:1.5;margin-bottom:var(--s3)}
.editbar{display:flex;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.editbar button{flex:1 1 auto;min-width:112px;padding:var(--s3) var(--s2);min-height:var(--tap);
  border-radius:var(--r1);border:.5px solid var(--line);background:var(--card);color:var(--blue);
  font-size:var(--f3);font-weight:600}
@media (max-width:520px){ .editbar button{font-size:13.5px;min-width:96px;padding:9px 6px} }
.editbar button.on{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.four label{display:block}
.four span{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.four input{width:100%;padding:9px 6px;text-align:center;background:var(--card2);
  border:.5px solid var(--line);border-radius:8px;color:var(--ink)}

body.wide .walls{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
body.wide .wall{min-width:0}


body.wide .cargo{left:20%}
body.wide .slot .dsc, body.wide .slot .st{font-size:11px}
body.wide .slot .code{font-size:13px}
body.wide .slot .dsc, body.wide .slot .st{font-size:11px}


.empty{border:1px dashed var(--line);border-radius:var(--r2);padding:var(--s6) var(--s5);text-align:center;color:var(--ink2)}
.empty strong{display:block;font-size:var(--f4);color:var(--ink);margin-bottom:var(--s2);font-weight:600}
.empty p{margin:0 auto;max-width:36ch;font-size:var(--f3);line-height:1.5}
.btn{display:block;width:100%;max-width:320px;margin:var(--s4) auto 0;padding:var(--s3);
  min-height:var(--tap);border:0;
  border-radius:var(--r1);background:var(--blue);color:var(--onblue);font-size:var(--f4);font-weight:600}
.btn:active{opacity:.85}
.btn.sec{background:var(--card);color:var(--blue);border:.5px solid var(--line)}
.fld{display:block;margin-bottom:14px}
/* short fields pack across the top so the table gets the room */
.fgrid{display:grid;grid-template-columns:1fr;gap:0 14px}
.fgrid .fld{margin-bottom:12px}
@media (min-width:700px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1080px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* narrative boxes are wider than a field but do not need the whole page */
.fgrid.narr{grid-template-columns:1fr}
@media (min-width:820px){.fgrid.narr{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fgrid.narr textarea{min-height:96px}
.fld.wide{margin-bottom:14px}
.fld>span{display:block;font-size:var(--f2);font-weight:600;color:var(--ink2);margin-bottom:var(--s1)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;
  padding:var(--s3);min-height:var(--tap);background:var(--card);
  border:.5px solid var(--line);border-radius:var(--r1);appearance:none;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:.5px solid var(--line2);border-radius:var(--r2);padding:var(--s4);max-width:600px}
.nowbar{display:flex;align-items:center;gap:var(--s3);background:var(--card);
  border:.5px solid var(--line2);border-radius:var(--r2);padding:var(--s3) var(--s4);margin-bottom:var(--s4)}

/* ---------- slot contents sized to the slot itself ----------
   container queries measure the CONTENT box, rules inside one cannot style
   the container itself, and these must outrank the body.wide font sizes,
   hence the .wall prefix                                                  */
.wall .cargo .slot .dsc,.wall .cargo .slot .st{display:none}

/* tall enough to stack the name under the code */

  .wall .cargo .slot .dsc{display:-webkit-box;-webkit-line-clamp:1;white-space:normal}
}

  .wall .cargo .slot .dsc{-webkit-line-clamp:2}

  .wall .cargo .slot>span{flex-direction:row;align-items:baseline;gap:7px;flex:1;min-width:0}

<body>

<aside class="side" id="side"></aside>

<header class="hdr">
  <div class="sbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="text" id="q" placeholder="Search items, compartments, guides" autocomplete="off">
    <button id="qclear" style="display:none">Clear</button>
  </div>
  <div class="titlerow"><h1 id="title">Inventory</h1><span id="savedtick" class="savedtick" aria-live="polite"></span></div>

</header>

<main class="main">
<div id="syncbar" class="demobar" style="display:none"></div>
<div id="demobar" class="demobar" style="display:none"></div>
<section class="view on" id="v-home"></section>
<section class="view" id="v-compartments"></section>
<section class="view" id="v-inventory"></section>
<section class="view" id="v-sweep"></section>
<section class="view" id="v-guide"></section>
<section class="view" id="v-reorder"></section>
<section class="view" id="v-tidy"></section>
<section class="view" id="v-bay"></section>
<section class="view" id="v-compdetail"></section>
<section class="view" id="v-itemdetail"></section>
<section class="view" id="v-data"></section>
<section class="view" id="v-print"></section>
<section class="view" id="v-labels"></section>
<section class="view" id="v-search"></section>
</main>

<nav class="tabs" id="tabs"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetbody"></div></div>
<div class="toast" id="toast"></div>
<div class="rotgate" id="rotgate"><div class="rg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12 2v2M12 20v2"/></svg><b>Turn the iPad sideways</b><span>FSU runs in landscape so the storage wall has room.</span><button class="lnkbtn" data-rotlock="0">Allow portrait on this device</button></div></div>

<script>
const PAGE="van";
"use strict";
const CATS=[["A","Scene control & safety"],["B","Documentation"],["C","Latent prints"],
["D","Biological / DNA"],["E","Trace"],["F","Impressions"],["G","Firearms / trajectory"],
["H","Packaging & sealing"],["I","Tools & access"],["J","Digital / electronics"],["K","Van infrastructure"]];
const CLASSES=["Consumable","Durable","Reagent","Regulated"];
const STATUSES=["Stocked","Low","Out","Expired","Service due","Not carried"];
const SIDES=["Driver side","Passenger side","Rear doors","Cab"];
// drawn as you see it standing inside the van: facing the driver wall the cab is
// to your right, facing the passenger wall it is to your left
const groupOf = code => String(code).replace(/\d+$/,"");
const bayOf   = code => String(code)[0];
function bayBounds(bay){
  const cs=comps().filter(c=>bayOf(c.code)===bay);
  if(!cs.length)return null;
  const x=Math.min(...cs.map(c=>c.x)), y=Math.min(...cs.map(c=>c.y));
  return {side:cs[0].side, x, y,
    w:Math.max(...cs.map(c=>c.x+c.w))-x, h:Math.max(...cs.map(c=>c.y+c.h))-y, n:cs.length};
}
/* the van, side on, cab to the left; the cargo grid overlays x 48-249 of this box */
function vanSVG(){
  return `<svg class="vansvg" viewBox="0 0 255 100" preserveAspectRatio="none" aria-hidden="true">
    <ellipse cx="130" cy="94.5" rx="122" ry="3.5" class="vs-shadow"/>
    <path d="M6 84 L6 60 Q6 44 15 40 L30 36 L45 13 Q47 8 54 8 L243 8 Q250 8 250 15 L250 78 Q250 84 243 84 Z" class="vs-body"/>
    <rect x="50" y="10.5" width="197.5" height="71.5" rx="2" class="vs-panel"/>
    <path d="M32 36 L46 14 L56 14 L56 36 Z" class="vs-glass"/>
    <path d="M6 60 L15 40 L30 36" class="vs-line"/>
    <line x1="48" y1="13" x2="48" y2="83" class="vs-line"/>
    <rect x="42" y="49" width="5" height="2" rx="1" class="vs-dark"/>
    <rect x="26" y="29" width="6" height="8" rx="1.5" class="vs-dark"/>
    <path d="M6 46 L12 45 L12 56 L6 56 Z" class="vs-lamp"/>
    <rect x="246" y="17" width="3.5" height="14" rx="1" class="vs-tail"/>
    <path d="M3 64 L3 82 Q3 87 9 87 L26 87" class="vs-line"/>
    <path d="M19 84 A15 15 0 0 1 49 84 Z" class="vs-arch"/>
    <path d="M199 84 A15 15 0 0 1 229 84 Z" class="vs-arch"/>
    <circle cx="34" cy="84" r="12" class="vs-tyre"/><circle cx="34" cy="84" r="5.5" class="vs-hub"/>
    <circle cx="214" cy="84" r="12" class="vs-tyre"/><circle cx="214" cy="84" r="5.5" class="vs-hub"/>
  </svg>`;
}
function vanKey(bay,showEnds){
  const b=bayBounds(bay); if(!b)return "";
  const W=S.walls[b.side]||{cols:144,rows:60};
  return `<div class="vankey">
    <div class="vanwrap${b.side==="Driver side"?" mirrored":""}">
      <div class="vanbody">${vanSVG()}
        <div class="cargo" style="grid-template-columns:repeat(${W.cols},minmax(0,1fr));
          grid-template-rows:repeat(${W.rows},minmax(0,1fr));gap:0">
          <div class="here" style="grid-column:${b.x+1}/span ${b.w};grid-row:${b.y+1}/span ${b.h}"></div>
        </div></div></div>
    ${showEnds?`<div class="keyends"><span>${b.side==="Driver side"?"Rear":"Front"}</span><span>${b.side==="Driver side"?"Front":"Rear"}</span></div>`:""}

const GUIDEITEMS=[["Magnetic fingerprint powder","C","Reagent",["Use on non-metal surfaces only: paper, wood, tile, glass.","Do not use on metal.","Do not use on a wet surface. Powder and moisture turn to paste — let it dry or use another method.","Pour a small amount onto a plate or an evidence envelope folded like a plate. Never dip the applicator into the container.","Apply with the magnetic applicator only.","Lift onto a white backing card."]],["Black fingerprint powder","C","Reagent",["Use on light-coloured surfaces: light paper, wood, tile, glass, metals.","Lift onto a white backing card. The card is always the opposite colour to the powder.","Apply with the fiberglass brush.","Pour a small amount onto a plate or a folded evidence envelope. Never dip the brush into the container.","Do not use on a wet surface."]],["White fingerprint powder","C","Reagent",["Use on dark-coloured surfaces: dark paper, wood, tile, glass, metals.","Lift onto a black backing card. The card is always the opposite colour to the powder.","Apply with the fiberglass brush.","Pour a small amount onto a plate or a folded evidence envelope. Never dip the brush into the container.","Do not use on a wet surface."]],["Copper fingerprint powder","C","Reagent",["Carried in the kit as an alternative when black and white give poor contrast.","Match the powder to the surface: the powder must contrast with the surface, and the backing card must contrast with the powder.","Pour a small amount onto a plate or a folded evidence envelope. Never dip the brush into the container.","Do not use on a wet surface."]],["Silver black fingerprint powder","C","Reagent",["Do not use. Carried in the kit but not to be used.","Use black powder on light surfaces or white powder on dark surfaces instead."]],["Magnetic applicator","C","Durable",["For magnetic powder only.","Load from powder poured onto a plate or folded envelope, never from the container.","Clean between surfaces."]],["Fiberglass brush","C","Durable",["For applying white and black powder.","Load from powder poured onto a plate or folded envelope, never from the container.","Do not use on a wet surface."]],["Feather duster","C","Durable",["For removing small amounts of excess powder from a print before lifting.","Never dip it into a powder container."]],["Hinge lifters","C","Consumable",["Lift the developed print, then fold the hinge over onto the backing card.","Backing card is the opposite colour to the powder used: white card for black or magnetic powder, black card for white powder.","Label the lift with the location it came from and the surface."]],["Gel lifters","C","Consumable",["For lifting from textured or curved surfaces where tape will not sit flat.","Photograph the lift before packaging.","Label with the location and surface it came from."]],["Lifting tape","C","Consumable",["For flat surfaces. Lay the tape down without trapping air, lift in one movement.","Transfer to a backing card of the opposite colour to the powder.","Label with the location and surface it came from."]],["Backing cards, white","C","Consumable",["Used with black powder and with magnetic powder.","The card is always the opposite colour to the powder so the lift still reads."]],["Backing cards, black","C","Consumable",["Used with white powder.","The card is always the opposite colour to the powder so the lift still reads."]],["Cotton swabs, DNA","D","Consumable",["Collect with one wet swab and one dry swab from the same area.","One sample per envelope. DNA from different areas of the scene never shares an envelope.","Name the exact surface swabbed on the envelope, not just the room.","Elimination DNA is required before the swabs can be tested if there is a known victim."]],["Buccal swab kit","D","Consumable",["For known samples and elimination DNA.","One sample per envelope.","Elimination DNA is required before scene swabs can be tested if there is a known victim."]],["GSR / SEM kit","E","Consumable",["Record a separate time for every sample site.","Sites are taken as right back, right palm, left back, left palm.","Write each site and its time on the envelope, for example: right back 0943 hrs, right palm 0945 hrs.","Note where the kit was collected, including at autopsy."]],["Red evidence envelopes","H","Consumable",["General evidence. Anything that is not drugs and fits in an envelope.","Write the description on the envelope first, then copy it into EFORCE word for word.","The description answers four things: what and how many, which evidence marker, where exactly, and when plus your item number.","Write the EFORCE tag number on the envelope once it is issued."]],["Blue evidence envelopes","H","Consumable",["Suspected drugs only. Nothing else goes in a blue envelope.","Suspected drugs must not go in a red envelope.","Write the EFORCE tag number on the envelope once it is issued."]],["Brown paper bags","H","Consumable",["For items too large for a normal envelope.","Place a red evidence sticker on the bag and label the sticker.","For clothing and lab items, state what the item is packaged in — the lab will not accept a submission without it."]],["Red evidence stickers","H","Consumable",["Applied to brown paper bags and any container that is not a pre-printed envelope.","Label the sticker the same way you would label an envelope."]],["Sharps container","H","Consumable",["Knives and other sharp or pointed objects.","If it could cut somebody handling it later, it goes in a sharps container, not an envelope."]],["Gun box","G","Consumable",["Unload the firearm. It goes into the box unloaded.","If it is a pistol, lock the slide back before boxing.","Zip-tie the firearm to the box so it cannot shift.","Draw an arrow on the printed firearm picture on the outside of the box showing which way the firearm faces inside.","Do not put ammunition in the gun box. Ammunition is packaged separately with its own EFORCE entry.","Check the chamber and the magazine before the box is closed.","EFORCE comment needs: date and time collected, status of the firearm, round count, whether one was chambered, and where it was found."]],["Small plastic baggies, casings","G","Consumable",["Each casing goes into its own small baggie.","All of the baggies then go into one red evidence envelope.","Label the envelope with how many casings are inside and the casing information."]],["Bullet boxes, cotton lined","G","Consumable",["A recovered bullet or fragment goes into a small brown box with cotton lining.","The box then goes into a red evidence envelope."]],["Dry safe","H","Durable",["For wet clothing. Wet items never go into evidence envelopes.","Follow the instructions posted on the dry safe itself."]],["Latex gloves","A","Consumable",["Worn any time you handle evidence. Wear two pairs.","The first pair stays on while you collect. Change the outer pair between items, not just when it looks dirty.","Two pairs keep your own prints and DNA off the evidence.","Patrol gloves are not PPE. They protect neither you nor the evidence."]],["Crime scene tape","A","Consumable",["Set the perimeter larger than you believe the scene is. You can bring it in later; you cannot re-secure ground people have walked through.","If you are not sure where the edge of the scene is, put the tape further out.","Everyone who crosses the tape goes on the scene entry log, including you."]],["Evidence markers","B","Durable",["Set the marker next to the item. Never move evidence to place a marker — if placing it there would move the item, set it further away.","The marker number you use is the number that goes on the envelope and in your photographs.","Some markers have a scale built in; use it for close-up shots."]],["Temporary evidence markers","B","Consumable",["Placed on arrival to keep people off possible evidence until the real markers reach the scene.","Do not move evidence to place one."]],["L-scale","B","Durable",["Used in every close-up photograph.","It gives size in both directions, and the targets let the lab correct for camera angle.","Use the marker's built-in scale or a scale from the evidence collection box."]],["Scene camera","B","Durable",["Check it before you need it: charged, and no files left on the card.","Photograph in four ranges in order: overall, mid, close, then close-up with scale.","Overall: start wide, include street signs or the address so the photos tie to a location.","Mid: buildings and obvious evidence, overlapping every frame so positions relate to each other.","Close: the item filling the frame, still in place.","Close-up with scale: the same shot with a scale beside it.","Get the overall shots early, before more people arrive and add to the scene.","Back at the station, move the photographs off the card and delete them from the camera card."]]];
function seedGuideItems(){
  let added=0;
  GUIDEITEMS.forEach(([name,cat,cls,steps])=>{
    if(S.items.some(i=>String(i.name).toLowerCase()===name.toLowerCase()))return;
    S.items.push({id:newId(),name,loc:"",cat,cls,qty:0,par:"",date:"",
      status:"Stocked",gapType:"",note:"",steps:steps.slice(),source:GUIDESRC,
      verified:"",uses:[],rel:[],links:[],fav:false});
    added++;
  });
  return added;
}
const STOCKV=8;   // 8: the stock forms' categories now match the list the editor offers
function seedForms(){
  STOCKFORMS.forEach(t=>{
    const have=S.forms.find(f=>f.name===t.name);
    if(have){
      have.stock=true;                       // shipped with the app, so it cannot be deleted
      // refresh the built-in definition unless it has been edited by hand
      if(!have.edited){have.fields=parseFields(t.fields);have.desc=t.desc;have.rev=t.rev;have.cat=t.cat}
      return;
    }
    S.forms.push({id:newId(),name:t.name,cat:t.cat,rev:t.rev,desc:t.desc,
      stock:true,verified:"",fields:parseFields(t.fields)});
  });
}

function bayTally(bay){
  const cs=comps().filter(c=>bayOf(c.code)===bay).map(c=>compState(c.code));
  const a=cs.filter(s=>s.k==="action").length, t=cs.filter(s=>s.k==="attn").length,
        u=cs.filter(s=>s.k==="unchecked").length;

/* what each view is about, so a direct link to this page (a home-screen shortcut, a bookmark)
   can open the right record instead of just the view */
const REFOF={incident:()=>curInc,sketch:()=>curSketch,fill:()=>curFill,
  itemdetail:()=>curItem,compdetail:()=>curComp,bay:()=>curBay};
/* a ref has to name a record of the right kind: an incident id is not a sketch */
const refFits=(v,ref)=>{
  if(!ref)return false;
  const has=(list,key)=>((S[list]||[]).some(r=>r&&String(r[key||"id"])===String(ref)));
  if(v==="incident")return has("incidents");
  if(v==="sketch")return has("sketches");
  if(v==="fill")return has("fills");
  if(v==="itemdetail")return has("items");
  if(v==="compdetail"||v==="bay")return has("comps","code")||(v==="bay"&&/^[0-9]$/.test(String(ref)));
  return false;
};
/* keep the address in step with where you are, so a reload and Back both land here. This
   never points at the other page — it only ever rewrites this page's own hash. */
function keepAddress(){
  if(!here(view)||typeof history==="undefined"||!history.replaceState)return;
  const ref=REFOF[view]?REFOF[view]():null;
  const want="#v="+encodeURIComponent(view)+(ref?"&ref="+encodeURIComponent(ref):"");
  if(location.hash!==want){try{history.replaceState(null,"",want)}catch(_){}}
}
/* opened as #v=<view>&ref=<id>: a direct link into this page, never a hop from the other one */
function openFromHash(){
  const h=String(location.hash||"").replace(/^#/,"");
  if(!h)return false;
  const p=new URLSearchParams(h.replace(/&/g,"&"));
  const v=p.get("v"), ref=p.get("ref");
  if(!v||!here(v))return false;
  if(ref&&!refFits(v,ref)&&String(ref).indexOf("new")!==0){
    // a stale or wrong-kind link: open the view, not a record that is not there
    view=v; return true;
  }
  if(ref){
    if(v==="incident")curInc=ref;
    else if(v==="sketch"){
      if(String(ref).indexOf("new")===0){startSketch(String(ref).slice(4));return true}
      curSketch=ref;selObj=null;curLayer=null}
    else if(v==="fill")curFill=ref;
    else if(v==="itemdetail")curItem=ref;
    else if(v==="compdetail")curComp=ref;
    else if(v==="bay")curBay=ref;
  }
  view=v;
  return true;
}
/* a new sketch. Only ever called from inside the Scenes app, where "sketch" always lives. */
function startSketch(incId){
  if(!here("sketch"))return;   // structurally unreachable from the van; no-op rather than a jump
  const sk=newSketch();
  if(incId){const inc=incidentOf(incId);
    if(inc)Object.assign(sk,{incidentId:inc.id,caseNo:inc.caseNo,offence:inc.offence,addr:inc.addr})}
  save();
  curSketch=sk.id; selObj=null; curLayer=null; view="sketch";
  try{history.replaceState(null,"","#v=sketch&ref="+sk.id)}catch(_){}
  render();
  return typeof sketchMetaSheet==="function"?sketchMetaSheet(sk):undefined;
}

   The main app runs the incident screens; the sketch app adds a marker or a photograph to the
   evidence log of the incident its sketch belongs to. ---------- */
function logAct(kind,text){
  try{ S.activity=(S.activity||[]).slice(-499);
    S.activity.push({t:new Date().toISOString(),who:S.who||"",k:kind,m:String(text).slice(0,200)}) }catch(_){}
}

const DOCPLAN=[
  {key:"entrylog",  form:"Crime scene entry log",  label:"Entry log"},
  {key:"evidence",  form:"Evidence log",           label:"Evidence log"},
  {key:"photolog",  form:"Photograph log",         label:"Photo log"},
  {key:"sketch",    form:null,                     label:"Sketch"},
  {key:"report",    form:"Forensic services report",label:"Report"}
];
function newIncident(){
  const inc={id:newId(),caseNo:"",offence:"",addr:"",
    opened:new Date().toISOString(),closed:"",
    plan:DOCPLAN.map(d=>d.key)};
  (S.incidents=S.incidents||[]).push(inc); saveLocal(); return inc;
}
const incidents=()=>S.incidents||[];
const openIncidents=()=>incidents().filter(i=>!i.closed);
const closedIncidents=()=>incidents().filter(i=>i.closed)
  .sort((a,b)=>String(b.closed).localeCompare(String(a.closed)));
const incidentOf=id=>incidents().find(x=>x.id===id);
// everything attached to one incident, whether exported or not
function docsFor(incId){
  const f=(S.fills||[]).filter(x=>x.incidentId===incId).map(x=>({
    kind:"fill",id:x.id,rec:x,type:x.formName||"Form",exported:!!x.exported}));
  const s=(S.sketches||[]).filter(x=>x.incidentId===incId).map(x=>({
    kind:"sketch",id:x.id,rec:x,type:"Sketch",exported:!!x.exported}));
  return [...f,...s];
}
// what the checklist shows for one planned document
function planState(inc,key){
  const d=DOCPLAN.find(x=>x.key===key); if(!d)return null;
  const mine=docsFor(inc.id).filter(x=>
    d.form? x.type===d.form : x.kind==="sketch");
  if(!mine.length)return {d,state:"none",docs:[]};
  if(mine.every(x=>x.exported||(x.rec&&x.rec.completed)))return {d,state:"done",docs:mine};
  return {d,state:"open",docs:mine};
}

function syncPhoto(sk,o){
  if(!sk||!sk.incidentId||!o||o.t!=="photopoint")return 0;
  const inc=incidentOf(sk.incidentId); if(!inc)return 0;
  const f=S.forms.find(x=>x.name==="Photograph log"); if(!f)return 0;
  const tbl=(f.fields||[]).find(x=>x.type==="table"); if(!tbl)return 0;
  let rec=(S.fills||[]).find(x=>x.incidentId===inc.id&&x.formId===f.id&&!x.exported);
  if(!rec){ rec=newFill(f); rec.incidentId=inc.id;
    const put=(re,v)=>{const fd=(f.fields||[]).find(x=>re.test(x.label)); if(fd&&v)rec.values[fd.id]=v};
    put(/case/i,inc.caseNo); put(/address|scene/i,inc.addr); put(/^date$/i,today()); put(/photographer/i,S.whoName||S.who||"") }
  const rows=Array.isArray(rec.values[tbl.id])?rec.values[tbl.id]:[];
  const num=String(o.n||"").trim(); if(!num)return 0;
  const key=(tbl.cols||[])[0]||"No.";
  let row=rows.find(r=>String((r||{})[key]||"").trim()===num);
  if(!row){row={};row[key]=num;rows.push(row)}
  if(o.label&&o.label.trim())row["What it shows"]=o.label.trim();
  row["Facing"]=compassOf(o.r);
  rec.values[tbl.id]=rows.filter(r=>Object.values(r||{}).some(v=>String(v||"").trim()));
  saveLocal(); return 1;
}
incidents().forEach(i=>{ if(Array.isArray(i.plan)&&!i.plan.includes("photolog")){const k=i.plan.indexOf("evidence"); i.plan.splice(k>-1?k+1:i.plan.length,0,"photolog")} });


// a marker on an incident sketch writes itself into that incident's evidence log
function syncMarker(sk,o){
  if(!sk||!sk.incidentId||o.t!=="marker")return 0;
  const inc=incidentOf(sk.incidentId); if(!inc)return 0;
  const f=S.forms.find(x=>x.name==="Evidence log"); if(!f)return 0;
  const tbl=(f.fields||[]).find(x=>x.type==="table"); if(!tbl)return 0;
  let rec=(S.fills||[]).find(x=>x.incidentId===inc.id&&x.formId===f.id&&!x.exported);
  if(!rec){
    rec=newFill(f); rec.incidentId=inc.id;
    const put=(re,v)=>{const fd=(f.fields||[]).find(x=>re.test(x.label)); if(fd&&v)rec.values[fd.id]=v};
    put(/case/i,inc.caseNo); put(/address|scene/i,inc.addr);
  }
  const rows=Array.isArray(rec.values[tbl.id])?rec.values[tbl.id]:[];
  const num=String(o.n||"").trim(); if(!num)return 0;
  let row=rows.find(r=>String((r||{}).Marker||"").trim()===num);
  if(!row){ row={}; row.Marker=num; rows.push(row) }
  if(o.label&&o.label.trim())row.Item=o.label.trim();
  rec.values[tbl.id]=rows.filter(r=>Object.values(r||{}).some(v=>String(v||"").trim()));
  saveLocal();
  return 1;
}

function offerIncident(sk){
  setTimeout(()=>askConfirm("File it to an incident?",
    "This sketch has a case number but no incident. An incident keeps the entry log, evidence log, sketch and report together and bundles them at the end.",
    "Start incident "+sk.caseNo,false,()=>{
      const inc=newIncident(); inc.caseNo=sk.caseNo; inc.addr=sk.addr||""; inc.offence=sk.offence||"";
      sk.incidentId=inc.id; let n=0; (sk.objs||[]).forEach(o=>{if(o.t==="marker")n+=syncMarker(sk,o)});
      logAct("incident","Started incident "+inc.caseNo+" from a sketch"); save(); if(typeof renderSketch==="function")renderSketch();
      toast("Incident started"+(n?" — markers written to the evidence log":""))}),450);
}


function parseFields(t){
  return (t||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((l,ix)=>{
    const b=l.split("|").map(x=>x.trim());
    const label=b[0]; let type=(b[1]||"text").toLowerCase();
    if(!FTYPES.includes(type))type="text";
    const cols=type==="table"?(b[2]||"Item").split(",").map(x=>x.trim()).filter(Boolean):null;
    const def=type==="table"?null:(b[2]||"").trim()||null;
    return {id:"f"+ix+"_"+label.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,12),label,type,cols,def};
  });
}

function newFill(f){
  const rec={id:newId(),formId:f.id,formName:f.name,rev:f.rev||"",cat:f.cat||"",
    started:new Date().toISOString(),values:{}};
  (f.fields||[]).forEach(x=>{rec.values[x.id]=x.type==="table"?[{}]:x.type==="check"?false:(x.def||"")});
  S.fills.push(rec); saveLocal(); return rec;
}

/* ---------- case packages, and saying so when a save is refused ----------
   The main app bundles and restores a case; the sketch app saves one from the canvas. ---------- */
/* ---- when saving fails, say so ---- */
var SAVEFAIL=false;   // var, because the first save happens before this block runs
function saveFailed(on){
  try{
  if(on===!!SAVEFAIL)return; SAVEFAIL=on;
  let bar=document.getElementById("savefail");
  if(!on){ if(bar)bar.remove(); toast("Saving works again"); return }
  if(!bar){ bar=document.createElement("div"); bar.id="savefail"; document.body.prepend(bar) }
  bar.innerHTML=`<span><b>Changes are not being saved.</b> This device's storage for the app is full or
    blocked, and nothing entered since this appeared will survive a reload. Save a case package now,
    then free space by deleting old sketches or photographs.</span>
    <button id="sfcase">Save case package</button><button id="sfdata">Storage</button>`;
  $("#sfcase").onclick=()=>exportCasePackage("all","fsu-all");
  $("#sfdata").onclick=()=>go("data");
  }catch(e){ console.error("save warning failed",e) }
}


/* ---- case packages: the only copy of case material that leaves the device ---- */
async function casePackage(scope){
  const all=scope==="all";
  const incIds=new Set(); if(!all&&scope.incidentId)incIds.add(scope.incidentId);
  const sketches=(S.sketches||[]).filter(s=>all||s.id===scope.sketchId||(scope.incidentId&&s.incidentId===scope.incidentId));
  sketches.forEach(s=>{if(s.incidentId)incIds.add(s.incidentId)});
  const incs=incidents().filter(i=>all||incIds.has(i.id));
  const fills=(S.fills||[]).filter(f=>all||incIds.has(f.incidentId));
  const photoIds=new Set();
  sketches.forEach(s=>{ if(s.bg&&s.bg.imgId)photoIds.add(s.bg.imgId); (s.objs||[]).forEach(o=>{if(o.photoId)photoIds.add(o.photoId)}) });
  const photos={};
  for(const id of photoIds){ try{ const d=await photoGet(id); if(d)photos[id]=d }catch(e){} }
  return {fsuCase:1,version:APP_VERSION,exported:new Date().toISOString(),unit:S.vanName||"",incidents:incs,fills,sketches,photos,forms:S.forms||[]};
}
async function exportCasePackage(scope,label){
  toast("Gathering the case material…");
  let pkg; try{ pkg=await casePackage(scope) }catch(e){ return toast("Could not gather it: "+(e.message||e)) }
  const name=String(label||"case").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".fsucase.json";
  const blob=new Blob([JSON.stringify(pkg)],{type:"application/json"});
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:"FSU case package"});
    else dlBlob(blob,name);
  }catch(e){ if(e&&e.name==="AbortError")return; dlBlob(blob,name) }
  const now=new Date().toISOString(); S.lastCase=now;
  pkg.sketches.forEach(s=>{const sk=(S.sketches||[]).find(x=>x.id===s.id); if(sk)sk.packaged=now});
  saveLocal(); if(view==="data"&&typeof renderData==="function")renderData();
  else if(view==="sketch"&&typeof renderSketch==="function")renderSketch();
  const np=Object.keys(pkg.photos).length;
  logAct("case","Saved a case package"); toast("Case package saved — "+pkg.sketches.length+" sketch"+(pkg.sketches.length===1?"":"es")+", "+np+" photograph"+(np===1?"":"s")+". Put it in the case file.");
}
async function importCasePackage(text){
  let pkg; try{pkg=JSON.parse(text)}catch(e){return toast("That isn't a case package")}
  if(!pkg||pkg.fsuCase!==1)return toast("That isn't a case package");
  let n=0;
  const merge=key=>{ S[key]=S[key]||[]; (pkg[key]||[]).forEach(r=>{ if(!r||!r.id)return;
    const i=S[key].findIndex(x=>x.id===r.id); if(i>-1)S[key][i]=r; else S[key].push(r); n++ }) };
  merge("incidents"); merge("fills"); merge("sketches");
  S.forms=S.forms||[]; (pkg.forms||[]).forEach(f=>{ if(f&&f.id&&!S.forms.some(x=>x.id===f.id))S.forms.push(f) });
  let np=0; for(const id in (pkg.photos||{})){ try{ await photoPut(id,pkg.photos[id]); np++ }catch(e){} }
  saveLocal(); render();
  toast("Restored "+n+" record"+(n===1?"":"s")+" and "+np+" photograph"+(np===1?"":"s"));
}

/* ---------- github sync ---------- */
if(!S.gh)S.gh={owner:"",repo:"",path:"data.json",token:"",sha:"",last:""};
// merging needs three things per record: a counter that does not consult the clock, the
// device that set it, and a marker when it is deleted. SYNC_DESIGN.txt is the long version.
if(!S.dev)S.dev=newId();
if(typeof S.lam!=="number")S.lam=0;
const KINDS=["items","comps","forms"];
const kKey=(k,r)=>k==="comps"?r.code:r.id;
if(!S.tomb||typeof S.tomb!=="object")S.tomb={};
if(!S.base||typeof S.base!=="object")S.base={};
KINDS.forEach(k=>{if(!S.tomb[k]||typeof S.tomb[k]!=="object")S.tomb[k]={};
  if(!S.base[k]||typeof S.base[k]!=="object")S.base[k]={}});
if(!Array.isArray(S.conflicts))S.conflicts=[];
let dirty=false, pushT=null, conflict=false, syncErr="", tokenBad=false, badFile=false;

// content hash, ignoring the _ stamps and the order the keys happen to sit in, so that
// stamping a record does not itself look like an edit
const canon=v=>Array.isArray(v)?"["+v.map(canon).join(",")+"]"
  :(v&&typeof v==="object")?"{"+Object.keys(v).filter(x=>x[0]!=="_").sort()
      .map(x=>x+":"+canon(v[x])).join(",")+"}"
  :JSON.stringify(v===undefined?null:v);
const hash=s=>{let h=5381,g=52711;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h=((h*33)^c)>>>0;g=((g*31)+c)>>>0}
  return h.toString(36)+"."+g.toString(36)};
const rhash=r=>hash(canon(r));
// the same arbitrary answer on every device, so they all converge without talking
const newerRec=(a,b)=>{const av=(a&&a._v)||0, bv=(b&&b._v)||0;
  return av!==bv?av>bv:String((a&&a._d)||"")>String((b&&b._d)||"")};

// stamp whatever has moved since the last sync, and raise a tombstone for whatever has
// gone. Done here rather than at the several hundred places that mutate a record and call
// save(), because one forgotten site there is a silent hole.
function stampDirty(){
  const changed={};
  KINDS.forEach(k=>{
    const b=S.base[k], T=S.tomb[k], ch=changed[k]={}, seen={};
    S[k].forEach(r=>{
      const key=kKey(k,r); if(key==null||key==="")return;
      seen[key]=1; if(T[key])delete T[key];
      const h=rhash(r);
      if(b[key]!==h){r._v=++S.lam;r._d=S.dev;ch[key]=1}
      else if(r._v==null){r._v=++S.lam;r._d=S.dev}
    });
    Object.keys(b).forEach(key=>{
      if(seen[key])return;
      T[key]={_v:++S.lam,_d:S.dev,_t:new Date().toISOString()};
      ch[key]=1; delete b[key];
    });
  });
  const wh=rhash(S.walls||{});
  if(S.base.walls!==wh){S.wallsV=++S.lam;S.wallsD=S.dev;changed.walls=1}
  return changed;
}
function rebase(){
  KINDS.forEach(k=>{const b=S.base[k]={};
    S[k].forEach(r=>{const key=kKey(k,r); if(key!=null&&key!=="")b[key]=rhash(r)})});
  S.base.walls=rhash(S.walls||{});
}
// the edit that lost, kept where the person who typed it can put it back
function stashLoser(k,key,mine){
  S.conflicts.push({k,key,when:new Date().toISOString(),
    name:String(mine.name||mine.code||key),
    rec:JSON.parse(JSON.stringify(mine))});
  if(S.conflicts.length>50)S.conflicts.splice(0,S.conflicts.length-50);
}

// on the wire tombstones ride inside the arrays, so a build that predates them carries
// them through instead of dropping them, and shaped so that build's own filters hide them
const TOMBSHAPE={items:{name:"",status:"Not carried",gapType:"deliberate",cat:"",cls:"Consumable",
    loc:"",qty:0,par:"",date:"",note:"",steps:[],uses:[],rel:[],links:[]},
  comps:{desc:"",side:"",x:null,y:null,w:6,h:4},
  forms:{name:"",cat:"",rev:"",desc:"",fields:[]}};
const TOMBDAYS=90;
function splitWire(k,arr,alive,tomb){
  (Array.isArray(arr)?arr:[]).forEach(r=>{
    if(!r||typeof r!=="object")return;
    const key=kKey(k,r); if(key==null||key==="")return;
    if(r._x)tomb[key]={_v:+r._v||0,_d:r._d||"",_t:r._t||""};
    else alive[key]=r;
  });
}
function joinWire(k){
  const out=S[k].slice(), T=S.tomb[k], cut=Date.now()-TOMBDAYS*86400000;
  Object.keys(T).forEach(key=>{
    const t=T[key], when=Date.parse(t._t||"")||Date.now();
    if(when<cut)return delete T[key];
    out.push(Object.assign({},TOMBSHAPE[k],k==="comps"?{code:key}:{id:key},
      {_x:1,_v:t._v,_d:t._d,_t:t._t}));
  });
  return out;
}
function applyRec(k,key,stamp,alive){
  const i=S[k].findIndex(r=>kKey(k,r)===key);
  if(alive){ delete S.tomb[k][key];
    if(i>-1)S[k][i]=alive; else S[k].push(alive) }
  else { S.tomb[k][key]={_v:stamp._v||0,_d:stamp._d||"",_t:stamp._t||new Date().toISOString()};
    if(i>-1)S[k].splice(i,1) }
}
// merge a parsed remote file into this device, record by record. Absence is never a
// deletion — only a tombstone deletes — which is what stops an old build's whole-file
// push from destroying anything. Returns true if we hold something the remote does not.
function mergeRemote(o){
  const changed=stampDirty();
  let maxv=+o.lam||0, ahead=false;
  // a device that has never synced has no claim that its copy is the newer one, and the
  // stamps it just gave its own seeded defaults would otherwise beat the repo's real van.
  // Local-only records still survive: the merge is a union either way.
  const virgin=!S.synced;
  KINDS.forEach(k=>{
    const ra={}, rt={};
    splitWire(k,o[k],ra,rt);
    const T=S.tomb[k], b=S.base[k], ch=changed[k], mine={};
    S[k].forEach(r=>{const key=kKey(k,r); if(key!=null&&key!=="")mine[key]=r});
    const keys={};
    [mine,T,ra,rt].forEach(m=>Object.keys(m).forEach(key=>keys[key]=1));
    Object.keys(keys).forEach(key=>{
      const lv=mine[key]||T[key], rv=ra[key]||rt[key];
      maxv=Math.max(maxv,(rv&&+rv._v)||0,(lv&&+lv._v)||0);
      if(!rv){ahead=true;return}                      // never reached them: keep ours
      if(!lv){applyRec(k,key,rv,ra[key]);return}
      if(virgin){applyRec(k,key,rv,ra[key]);return}
      const rH=ra[key]?rhash(ra[key]):-1, lH=mine[key]?rhash(mine[key]):-1;
      if(rH===lH)return;                              // the same record: nothing to settle
      // who moved is decided on content, not on the stamps, so an edit made by a build that
      // does not know about stamps still propagates
      const based=b[key]!=null, theyMoved=!based||rH!==b[key], weMoved=!!ch[key];
      if(weMoved&&!theyMoved){ahead=true;return}
      if(theyMoved&&!weMoved){applyRec(k,key,rv,ra[key]);return}
      if(!newerRec(rv,lv)){ahead=true;return}
      // both sides moved on from the copy we last synced, so the one about to be replaced
      // is somebody's real work: keep it rather than drop it
      if(based&&mine[key])stashLoser(k,key,mine[key]);
      applyRec(k,key,rv,ra[key]);
    });
  });
  if(o.walls&&(virgin||newerRec({_v:+o.wallsV||0,_d:o.wallsD||""},{_v:S.wallsV||0,_d:S.wallsD||""}))){
    S.walls=o.walls; S.wallsV=+o.wallsV||0; S.wallsD=o.wallsD||"";
  } else if(o.wallsV!=null&&(S.wallsV||0)>(+o.wallsV||0)) ahead=true;
  maxv=Math.max(maxv,+o.wallsV||0);
  S.lam=Math.max(S.lam,maxv);                          // Lamport receive
  S.synced=true;
  S.demo=S.items.some(i=>i.demo)||S.comps.some(c=>c.demo)||S.forms.some(f=>f.demo);
  if(S.curLoc&&!S.comps.some(c=>c.code===S.curLoc))S.curLoc="";
  return ahead;
}

const b64enc=s=>{const b=new TextEncoder().encode(s);let out="";
  for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(out)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const ghOn=()=>!!(S.gh.owner&&S.gh.repo&&S.gh.token);
const ghURL=()=>`https://api.github.com/repos/${S.gh.owner}/${S.gh.repo}/contents/${S.gh.path||"data.json"}`;
const ghHead=()=>({Authorization:"Bearer "+S.gh.token,Accept:"application/vnd.github+json",
  "X-GitHub-Api-Version":"2022-11-28"});
const payload=()=>({v:2,lam:S.lam,items:joinWire("items"),comps:joinWire("comps"),
  forms:joinWire("forms").map(f=>{const c=Object.assign({},f);delete c.fills;return c}),
  walls:S.walls,wallsV:S.wallsV||0,wallsD:S.wallsD||"",demo:S.demo,
  savedAt:new Date().toISOString()});

const ghErr=s=>{const e=new Error(s===401?"Token rejected":s===403?"No access to that repo"
  :"GitHub error "+s); e.status=s; return e};
// GitHub tells us when the token dies, so nobody has to type the date in
function ghExpFrom(r){
  try{const h=r&&r.headers&&r.headers.get&&r.headers.get("github-authentication-token-expiration");
    if(!h)return; const d=String(h).slice(0,10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)){S.ghExp=d;S.ghAuto=true}
  }catch(e){}
}
async function ghGet(){
  const r=await fetch(ghURL()+"?ref=HEAD&t="+Date.now(),{headers:ghHead(),cache:"no-store"});
  ghExpFrom(r);
  if(r.status===404)return {missing:true};
  if(!r.ok)throw ghErr(r.status);
  const j=await r.json();
  let o=null; try{o=JSON.parse(b64dec(j.content))}catch(e){}
  // a file we cannot read is not a file we may write over: if the remote is intact and our
  // parse is what broke, overwriting it would take out every other device
  if(!o||typeof o!=="object"||!Array.isArray(o.items))return {sha:j.sha,bad:true};
  return {sha:j.sha,data:o};
}
function syncFail(e,silent){
  if(e&&(e.status===401||e.status===403)){
    tokenBad=true; syncErr=e.message; retries=0; clearTimeout(pushT);
    store.set(S); renderSyncBar(); renderSyncPill(); if(view==="data")renderData();
    if(!silent)toast(e.message);
    return "error";
  }
  syncErr=(e&&e.message)||"Couldn't reach GitHub";
  store.set(S); renderSyncBar(); renderSyncPill();
  if(dirty){clearTimeout(pushT); pushT=setTimeout(()=>ghPush(false),retryIn())}
  if(!silent)toast(syncErr);
  return "error";
}
// a pull can no longer discard anything local, so it is safe to press at any time
async function ghPull(silent){
  if(!ghOn())return;
  try{
    const g=await ghGet();
    if(g.missing){S.gh.sha="";store.set(S);
      if(!silent)toast("No data file yet — sync to create it");return"empty"}
    if(g.bad){badFile=true;syncErr="The file in the repo can't be read";
      store.set(S);renderSyncBar();renderSyncPill();if(view==="data")renderData();
      if(!silent)toast(syncErr);return"error"}
    badFile=false;
    const ahead=mergeRemote(g.data);
    S.gh.sha=g.sha; S.gh.last=new Date().toISOString();
    tokenBad=false; conflict=false; syncErr=""; retries=0;
    rebase(); dirty=!!ahead; store.set(S);
    renderSyncBar(); renderSyncPill(); render();
    if(ahead)queuePush(); else clearTimeout(pushT);
    if(!silent)toast("Synced — "+live().length+" items");

// read, merge, write. A 409 means somebody wrote in the gap between the read and the
// write, which is a reason to merge again, not a reason to ask anyone anything.
async function ghPush(force){
  if(!ghOn())return;
  clearTimeout(pushT);
  try{
    for(let attempt=0;attempt<4;attempt++){
      const g=await ghGet();
      if(g.bad&&!force){badFile=true;syncErr="The file in the repo can't be read";
        store.set(S);renderSyncBar();renderSyncPill();if(view==="data")renderData();
        toast(syncErr);return"error"}
      badFile=false;
      if(g.data&&!force)mergeRemote(g.data); else stampDirty();
      const body={message:"Van inventory — "+new Date().toISOString().slice(0,16).replace("T"," "),
        content:b64enc(JSON.stringify(payload(),null,1))};
      if(g.sha)body.sha=g.sha;
      const r=await fetch(ghURL(),{method:"PUT",
        headers:Object.assign({"Content-Type":"application/json"},ghHead()),
        body:JSON.stringify(body)});
      ghExpFrom(r);
      if(r.status===409||r.status===422)continue;
      if(!r.ok)throw ghErr(r.status);
      const j=await r.json();
      S.gh.sha=(j.content&&j.content.sha)||"";S.gh.last=new Date().toISOString();
      dirty=false;conflict=false;tokenBad=false;syncErr="";retries=0;
      rebase();store.set(S);
      renderSyncBar();renderSyncPill();if(view==="data")renderData();
      return"ok";
    }
    conflict=true;store.set(S);
    renderSyncBar();renderSyncPill();if(view==="data")renderData();
    toast("Couldn't settle with the other device — try again");
    return"error";
  }catch(e){return syncFail(e,true)}
}
let retries=0;
function retryIn(){retries=Math.min(retries+1,6);return Math.min(60000,2000*Math.pow(2,retries-1))}
