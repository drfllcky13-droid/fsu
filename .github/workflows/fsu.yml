name: FSU checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # both pages: index.html (the van) and scenes.html (the scene) are built from the same src/
      - name: index.html and scenes.html match src/
        run: node build.js --check
      # npm ci installs exactly what package-lock.json records and fails if it disagrees with
      # package.json, so the suite always runs on the pinned @playwright/test
      - name: Install the test suite
        working-directory: fsu-tests
        run: npm ci
      # the browsers come from that same Playwright, so their builds match it
      - name: Install Chromium and WebKit
        working-directory: fsu-tests
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright version
        working-directory: fsu-tests
        run: npx playwright --version
      # ESLint over each built page's script: no-undef, no-unused-vars, no-use-before-define
      - name: Lint
        working-directory: fsu-tests
        run: npm run lint
      - name: Sweep and flows
        working-directory: fsu-tests
        run: npx playwright test
      # the failed and flaky tests by name, even if the log above was cut short
      - name: Failures, if any
        if: always()
        working-directory: fsu-tests
        run: cat last-run.txt || true
